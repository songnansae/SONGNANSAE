<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Song Nansae</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #fff;
    color: #111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;
    font-weight: 400;
}


/* =========================
   HEADER
========================= */

.header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 92px;

    background: #fff;

    border-top: 1px solid #111;

    display: grid;
    grid-template-columns: 1fr 1fr 1fr;

    align-items: center;

    padding: 0 12px;

    z-index: 1000;
}


/* 왼쪽 + - */

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.header-button {
    border: 0;
    background: none;

    padding: 0;

    cursor: pointer;

    color: #111;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 22px;
    line-height: 1;

    font-weight: 400;
}

.header-button.minus {
    color: #cfcfcf;
}


/* 가운데 이름 */

.header-center {
    text-align: center;

    font-size: 11px;
}


/* 오른쪽 */

.header-right {
    text-align: right;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 22px;
}

.info-button {
    border: 0;
    background: none;

    padding: 0;

    cursor: pointer;

    font-size: 11px;
}

.info-dot {
    width: 12px;
    height: 12px;

    background: #111;

    border-radius: 50%;

    display: inline-block;
}


/* =========================
   MENU
========================= */

.menu {
    position: fixed;

    left: 0;
    top: 92px;

    width: 100%;

    background: #fff;

    border-bottom: 1px solid #111;

    z-index: 900;

    display: none;

    padding: 0 30px 35px;
}

.menu.open {
    display: block;
}


/* 메뉴 카테고리 */

.menu-list {
    display: flex;

    gap: 42px;

    align-items: center;

    flex-wrap: wrap;
}

.menu-item {
    border: 0;
    background: none;

    padding: 0;

    cursor: pointer;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 28px;

    color: #111;

    line-height: 1.2;
}

.menu-item:hover {
    text-decoration: underline;
}


/* =========================
   INFO
========================= */

.info-panel {
    position: fixed;

    top: 92px;
    right: 0;

    width: 420px;

    background: #fff;

    border-left: 1px solid #111;
    border-bottom: 1px solid #111;

    z-index: 950;

    padding: 30px;

    display: none;

    font-size: 12px;

    line-height: 1.6;
}

.info-panel.open {
    display: block;
}

.info-name {
    font-size: 22px;
    margin-bottom: 25px;
}

.info-panel a {
    color: inherit;
    text-decoration: none;
}


/* =========================
   HOME
========================= */

.home {
    padding-top: 92px;
}


/* 메인 3장 */

.hero {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 0;
}


/* 대표 작업 */

.hero-card {
    width: 100%;

    cursor: pointer;
}

.hero-image {
    display: block;

    width: 100%;

    height: calc(100vh - 92px);

    min-height: 500px;

    object-fit: cover;
}

.hero-caption {
    padding: 7px 5px 18px;

    font-size: 11px;

    line-height: 1.3;
}


/* 이미지가 아직 없을 때 */

.empty-hero {
    width: 100%;

    height: calc(100vh - 92px);

    min-height: 500px;

    background: #f2f2f2;
}


/* =========================
   CATEGORY
========================= */

.category-page {

    display: none;

    padding-top: 120px;

    padding-left: 15px;
    padding-right: 15px;

    padding-bottom: 80px;
}

.category-page.active {
    display: block;
}


.page-back {

    border: 0;
    background: none;

    padding: 0;

    margin-bottom: 35px;

    cursor: pointer;

    font-size: 11px;
}


.category-title {

    font-size: 28px;

    font-weight: 400;

    margin: 0 0 35px;
}


.work-list {

    display: flex;

    flex-direction: column;

    gap: 10px;

    max-width: 800px;
}


.work-button {

    border: 0;
    background: none;

    padding: 0;

    text-align: left;

    cursor: pointer;

    font-size: 22px;

    font-family: Arial, Helvetica, sans-serif;

    color: #111;

    width: fit-content;
}

.work-button:hover {
    text-decoration: underline;
}


/* =========================
   WORK PAGE
========================= */

.work-page {

    display: none;

    padding-top: 120px;

    padding-left: 15px;
    padding-right: 15px;

    padding-bottom: 80px;
}

.work-page.active {
    display: block;
}


.work-title {

    font-size: 28px;

    font-weight: 400;

    margin: 0 0 35px;
}


.gallery {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}


.gallery img {

    width: 100%;

    height: auto;

    display: block;

    object-fit: contain;
}


.gallery-single {

    max-width: 100%;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .header {

        height: 62px;

        padding: 0 10px;
    }

    .home {

        padding-top: 62px;
    }

    .menu {

        top: 62px;

        padding: 0 20px 25px;
    }

    .menu-list {

        gap: 22px;
    }

    .menu-item {

        font-size: 21px;
    }

    .info-panel {

        top: 62px;

        width: 100%;

        border-left: 0;
    }

    .hero {

        grid-template-columns: 1fr;
    }

    .hero-card:not(:first-child) {

        display: none;
    }

    .hero-image {

        height: calc(100vh - 62px);

        min-height: 450px;
    }

    .empty-hero {

        height: calc(100vh - 62px);

        min-height: 450px;
    }

    .category-page,
    .work-page {

        padding-top: 90px;

        padding-left: 12px;
        padding-right: 12px;
    }

    .category-title,
    .work-title {

        font-size: 24px;
    }

    .work-button {

        font-size: 19px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-left">

        <button
            class="header-button"
            id="openMenu"
            aria-label="Open menu"
        >
            +
        </button>

        <button
            class="header-button minus"
            id="closeMenu"
            aria-label="Close menu"
        >
            −
        </button>

    </div>


    <div class="header-center">
        Song Nansae
    </div>


    <div class="header-right">

        <button
            class="info-button"
            id="infoButton"
        >
            Info
        </button>

        <span class="info-dot"></span>

    </div>

</header>



<!-- =========================
     MENU
========================= -->

<nav
    class="menu"
    id="menu"
>

    <div class="menu-list">

        <button
            class="menu-item"
            data-category="commercial"
        >
            Commercial
        </button>

        <button
            class="menu-item"
            data-category="magazine"
        >
            Magazine
        </button>

        <button
            class="menu-item"
            data-category="personal"
        >
            Personal
        </button>

        <button
            class="menu-item"
            data-category="film"
        >
            Film
        </button>

    </div>

</nav>



<!-- =========================
     INFO
========================= -->

<section
    class="info-panel"
    id="infoPanel"
>

    <div class="info-name">
        Song Nansae
    </div>

    Photographer<br>
    Seoul, Korea<br><br>

    For commissions and inquiries<br>

    <a href="mailto:hello@songnansae.com">
        hello@songnansae.com
    </a>

    <br><br>

    <a
        href="https://www.instagram.com/songnansae"
        target="_blank"
    >
        Instagram
    </a>

</section>



<!-- =========================
     HOME
========================= -->

<main
    class="home"
    id="home"
>

    <section
        class="hero"
        id="hero"
    >

        <!-- JavaScript가 자동으로 생성 -->

    </section>

</main>



<!-- =========================
     CATEGORY PAGE
========================= -->

<section
    class="category-page"
    id="categoryPage"
>

    <button
        class="page-back"
        id="categoryBack"
    >
        ← Back
    </button>


    <h1
        class="category-title"
        id="categoryTitle"
    ></h1>


    <div
        class="work-list"
        id="workList"
    ></div>

</section>



<!-- =========================
     WORK PAGE
========================= -->

<section
    class="work-page"
    id="workPage"
>

    <button
        class="page-back"
        id="workBack"
    >
        ← Back
    </button>


    <h1
        class="work-title"
        id="workTitle"
    ></h1>


    <div
        class="gallery"
        id="gallery"
    ></div>

</section>



<script>

/* =========================================================
   GITHUB 설정

   네 GitHub 주소가

   github.com/songnansae/SONGNANSAE

   라면 아래 그대로 사용.

========================================================= */

const GITHUB_OWNER = "songnansae";

const GITHUB_REPO = "SONGNANSAE";

const GITHUB_BRANCH = "main";


/* 이미지가 들어가는 기본 폴더 */

const IMAGE_ROOT = "images";


/* 카테고리 */

const CATEGORIES = [
    "commercial",
    "magazine",
    "personal",
    "film"
];


/* 현재 선택 */

let currentCategory = "";

let currentWork = "";


/* 데이터 저장 */

const siteData = {

    commercial: [],
    magazine: [],
    personal: [],
    film: []

};


/* =========================================================
   DOM
========================================================= */

const menu =
    document.getElementById("menu");

const infoPanel =
    document.getElementById("infoPanel");

const home =
    document.getElementById("home");

const hero =
    document.getElementById("hero");

const categoryPage =
    document.getElementById("categoryPage");

const workPage =
    document.getElementById("workPage");

const categoryTitle =
    document.getElementById("categoryTitle");

const workTitle =
    document.getElementById("workTitle");

const workList =
    document.getElementById("workList");

const gallery =
    document.getElementById("gallery");


/* =========================================================
   GITHUB API
========================================================= */

async function githubAPI(path) {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_OWNER}/${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "GitHub API Error: " + path
        );

    }

    return await response.json();

}


/* =========================================================
   RAW IMAGE URL
========================================================= */

function imageURL(path) {

    return (
        `https://raw.githubusercontent.com/` +
        `${GITHUB_OWNER}/` +
        `${GITHUB_REPO}/` +
        `${GITHUB_BRANCH}/` +
        `${path}`
    );

}


/* =========================================================
   폴더 안의 작업 목록 가져오기
========================================================= */

async function getWorks(category) {

    try {

        const items =
            await githubAPI(
                `${IMAGE_ROOT}/${category}`
            );


        return items

            .filter(
                item =>
                    item.type === "dir"
            )

            .sort(
                (a, b) =>
                    a.name.localeCompare(
                        b.name,
                        "ko"
                    )
            );

    }

    catch (error) {

        console.log(
            "카테고리 없음:",
            category
        );

        return [];

    }

}


/* =========================================================
   작업 폴더 안의 사진 가져오기
========================================================= */

async function getImages(path) {

    try {

        const items =
            await githubAPI(path);


        return items

            .filter(

                item =>

                    item.type === "file" &&

                    /\.(jpg|jpeg|png|webp|gif)$/i
                        .test(item.name)

            )

            .sort(

                (a, b) =>

                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )

            );

    }

    catch (error) {

        return [];

    }

}


/* =========================================================
   전체 사이트 데이터 읽기
========================================================= */

async function loadSiteData() {

    for (
        const category of CATEGORIES
    ) {

        const works =
            await getWorks(category);


        siteData[category] = [];


        for (
            const work of works
        ) {

            const images =
                await getImages(
                    work.path
                );


            siteData[category].push({

                name: work.name,

                path: work.path,

                images: images

            });

        }

    }

}


/* =========================================================
   메인 화면 생성
========================================================= */

function renderHome() {

    hero.innerHTML = "";


    const allWorks = [];


    CATEGORIES.forEach(

        category => {

            siteData[category]
                .forEach(

                    work => {

                        if (
                            work.images.length > 0
                        ) {

                            allWorks.push({

                                category:
                                    category,

                                work:
                                    work

                            });

                        }

                    }

                );

        }

    );


    /*
       첫 번째 3개 작업을 메인에 표시

       나중에 순서를 바꾸고 싶으면
       폴더 이름 앞에 숫자를 붙이는 방식으로
       관리할 수도 있음.
    */


    const selected =
        allWorks.slice(0, 3);


    if (
        selected.length === 0
    ) {

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "hero-card";


            card.innerHTML = `

                <div class="empty-hero"></div>

                <div class="hero-caption">
                    작업을 추가하면 여기에 표시됩니다.
                </div>

            `;


            hero.appendChild(card);

        }

        return;

    }


    selected.forEach(

        item => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "hero-card";


            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "hero-image";


            image.src =
                imageURL(
                    item.work.images[0].path
                );


            image.alt =
                item.work.name;


            const caption =
                document.createElement(
                    "div"
                );

            caption.className =
                "hero-caption";


            caption.textContent =

                `${capitalize(item.category)}, ` +
                `${item.work.name}`;


            card.appendChild(
                image
            );


            card.appendChild(
                caption
            );


            card.addEventListener(
                "click",
                () => {

                    openWork(
                        item.category,
                        item.work.name
                    );

                }
            );


            hero.appendChild(
                card
            );

        }

    );

}


/* =========================================================
   CATEGORY 열기
========================================================= */

function openCategory(category) {

    currentCategory =
        category;


    currentWork =
        "";


    home.style.display =
        "none";


    workPage.classList
        .remove("active");


    categoryPage.classList
        .add("active");


    categoryTitle.textContent =
        capitalize(category);


    workList.innerHTML =
        "";


    const works =
        siteData[category];


    if (
        !works ||
        works.length === 0
    ) {

        workList.innerHTML = `

            <div
                style="
                    font-size:14px;
                    color:#999;
                "
            >
                아직 작업이 없습니다.
            </div>

        `;

        return;

    }


    works.forEach(

        work => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "work-button";


            button.textContent =
                work.name;


            button.addEventListener(
                "click",
                () => {

                    openWork(
                        category,
                        work.name
                    );

                }
            );


            workList.appendChild(
                button
            );

        }

    );

}


/* =========================================================
   WORK 열기
========================================================= */

function openWork(
    category,
    workName
) {

    currentCategory =
        category;


    currentWork =
        workName;


    home.style.display =
        "none";


    categoryPage.classList
        .remove("active");


    workPage.classList
        .add("active");


    workTitle.textContent =
        workName;


    gallery.innerHTML =
        "";


    const work =
        siteData[category]
            .find(
                item =>
                    item.name === workName
            );


    if (
        !work ||
        work.images.length === 0
    ) {

        gallery.innerHTML = `

            <div
                style="
                    font-size:14px;
                    color:#999;
                "
            >
                사진이 없습니다.
            </div>

        `;

        return;

    }


    work.images.forEach(

        image => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                imageURL(
                    image.path
                );


            img.alt =
                workName;


            gallery.appendChild(
                img
            );

        }

    );

}


/* =========================================================
   HOME으로 돌아가기
========================================================= */

function goHome() {

    home.style.display =
        "block";


    categoryPage.classList
        .remove("active");


    workPage.classList
        .remove("active");

}


/* =========================================================
   메뉴 열기
========================================================= */

document
    .getElementById("openMenu")
    .addEventListener(

        "click",
        () => {

            menu.classList
                .add("open");

        }

    );


/* =========================================================
   메뉴 닫기
========================================================= */

document
    .getElementById("closeMenu")
    .addEventListener(

        "click",
        () => {

            menu.classList
                .remove("open");

        }

    );


/* =========================================================
   INFO
========================================================= */

document
    .getElementById("infoButton")
    .addEventListener(

        "click",
        () => {

            infoPanel.classList
                .toggle("open");

        }

    );


/* =========================================================
   카테고리 버튼
========================================================= */

document
    .querySelectorAll(
        ".menu-item"
    )
    .forEach(

        button => {

            button.addEventListener(

                "click",
                () => {

                    const category =
                        button.dataset.category;


                    menu.classList
                        .remove("open");


                    openCategory(
                        category
                    );

                }

            );

        }

    );


/* =========================================================
   CATEGORY BACK
========================================================= */

document
    .getElementById("categoryBack")
    .addEventListener(

        "click",
        () => {

            goHome();

        }

    );


/* =========================================================
   WORK BACK
========================================================= */

document
    .getElementById("workBack")
    .addEventListener(

        "click",
        () => {

            openCategory(
                currentCategory
            );

        }

    );


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text) {

    if (!text) {
        return "";
    }

    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


/* =========================================================
   START
========================================================= */

(async function () {

    try {

        await loadSiteData();

        renderHome();

    }

    catch (error) {

        console.error(
            "사이트 데이터를 불러오지 못했습니다.",
            error
        );

        renderHome();

    }

})();

</script>

</body>
</html>
