<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #111;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
}

body {
  overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 52px;
  z-index: 1000;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 0 14px;

  background: rgba(255, 255, 255, 0.96);
}

.menu-button {
  justify-self: start;

  border: 0;
  background: none;

  padding: 0;
  margin: 0;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;
}

.logo {
  justify-self: center;

  color: #111;
  text-decoration: none;

  font-size: 13px;
  line-height: 1;
}

.info-button {
  justify-self: end;

  border: 0;
  background: none;

  padding: 0;
  margin: 0;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;
}

/* =========================
   INFO
========================= */

.info-panel {
  display: none;

  position: fixed;
  top: 52px;
  right: 14px;

  z-index: 900;

  width: 260px;

  background: #fff;

  font-size: 13px;
  line-height: 1.4;
}

.info-panel.show {
  display: block;
}

.info-panel a {
  color: #111;
  text-decoration: none;
}

.info-panel a:hover {
  text-decoration: underline;
}

/* =========================
   MENU
========================= */

.menu-panel {
  display: none;

  position: fixed;
  top: 52px;
  left: 14px;

  z-index: 900;

  width: 300px;

  background: #fff;
}

.menu-panel.show {
  display: block;
}

.menu-tabs {
  display: flex;
  gap: 18px;

  margin-bottom: 20px;
}

.menu-tab {
  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.menu-tab.active {
  text-decoration: underline;
}

.project-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.project-item {
  border: 0;
  background: none;

  padding: 0;

  text-align: left;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.project-item:hover {
  text-decoration: underline;
}

/* =========================
   HOME
========================= */

main {
  padding-top: 52px;
}

.home {
  width: 100%;
  min-height: calc(100vh - 52px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
}

.home-image-wrap {
  width: 100%;
  height: calc(100vh - 52px);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  padding: 0;
}

.home-image {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  user-select: none;
  -webkit-user-drag: none;
}

/* =========================
   DETAIL
========================= */

.detail {
  display: none;

  padding: 78px 14px 40px;
}

.detail.show {
  display: block;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;

  margin-bottom: 24px;
}

.detail-title {
  font-size: 13px;
}

.detail-category {
  font-size: 13px;
}

/*
  프로젝트 상세 이미지

  한 줄에 한 장.
  원본 비율 유지.
  절대 크롭하지 않음.
*/

.detail-grid {
  display: flex;
  flex-direction: column;

  width: 100%;

  gap: 10px;
}

.detail-image {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;
  object-position: center;

  margin: 0;
  padding: 0;
}

.back-button {
  margin-top: 40px;

  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.back-button:hover {
  text-decoration: underline;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: 48px;
    padding: 0 12px;
  }

  main {
    padding-top: 48px;
  }

  .info-panel {
    top: 48px;
    right: 12px;
  }

  .menu-panel {
    top: 48px;
    left: 12px;
    width: calc(100% - 24px);
  }

  .home {
    min-height: calc(100vh - 48px);
  }

  .home-image-wrap {
    height: calc(100vh - 48px);
  }

  .detail {
    padding: 68px 10px 30px;
  }

  /*
    모바일도 한 줄에 한 장
  */

  .detail-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .detail-image {
    width: 100%;
    height: auto;
  }
}
</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <button
    id="menuButton"
    class="menu-button"
    type="button"
  >+</button>

  <a
    href="#"
    id="logo"
    class="logo"
  >SONGNANSAE</a>

  <button
    id="infoButton"
    class="info-button"
    type="button"
  >Info</button>

</header>


<!-- =========================
     INFO PANEL
========================= -->

<div
  id="infoPanel"
  class="info-panel"
>

  <div>Commercial Photographer</div>
  <div>Seoul, Korea</div>

  <br>

  <div>For commissions and inquiries</div>

  <div>
    <a href="mailto:songnansae@gmail.com">
      songnansae@gmail.com
    </a>
  </div>

  <div>
    <a
      href="https://www.instagram.com/songnansae/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  </div>

</div>


<!-- =========================
     MENU PANEL
========================= -->

<div
  id="menuPanel"
  class="menu-panel"
>

  <div
    id="menuTabs"
    class="menu-tabs"
  >

    <button
      class="menu-tab active"
      data-category="commercial"
      type="button"
    >
      Commercial
    </button>

    <button
      class="menu-tab"
      data-category="magazine"
      type="button"
    >
      Magazine
    </button>

    <button
      class="menu-tab"
      data-category="personal"
      type="button"
    >
      Personal
    </button>

    <button
      class="menu-tab"
      data-category="film"
      type="button"
    >
      Film
    </button>

  </div>


  <div
    id="projectList"
    class="project-list"
  ></div>

</div>


<!-- =========================
     MAIN
========================= -->

<main>

  <!-- =====================
       HOME
  ====================== -->

  <section
    id="home"
    class="home"
  >

    <div
      id="homeImageWrap"
      class="home-image-wrap"
    >

      <img
        id="homeImage"
        class="home-image"
        src=""
        alt=""
      >

    </div>

  </section>


  <!-- =====================
       PROJECT DETAIL
  ====================== -->

  <section
    id="detail"
    class="detail"
  >

    <div class="detail-header">

      <div
        id="detailCategory"
        class="detail-category"
      ></div>

      <div
        id="detailTitle"
        class="detail-title"
      ></div>

    </div>


    <div
      id="detailGrid"
      class="detail-grid"
    ></div>


    <button
      id="backButton"
      class="back-button"
      type="button"
    >
      Back
    </button>

  </section>

</main>


<script>

/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "songnansae";
const GITHUB_REPO = "SONGNANSAE";
const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";


/* =========================================================
   CATEGORIES
========================================================= */

const categories = [
  "commercial",
  "magazine",
  "personal",
  "film"
];


/* =========================================================
   ELEMENTS
========================================================= */

const menuButton =
  document.getElementById("menuButton");

const logo =
  document.getElementById("logo");

const infoButton =
  document.getElementById("infoButton");

const menuPanel =
  document.getElementById("menuPanel");

const infoPanel =
  document.getElementById("infoPanel");

const projectList =
  document.getElementById("projectList");

const home =
  document.getElementById("home");

const homeImage =
  document.getElementById("homeImage");

const homeImageWrap =
  document.getElementById("homeImageWrap");

const detail =
  document.getElementById("detail");

const detailCategory =
  document.getElementById("detailCategory");

const detailTitle =
  document.getElementById("detailTitle");

const detailGrid =
  document.getElementById("detailGrid");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   STATE
========================================================= */

let currentCategory = "commercial";

let projectsByCategory = {

  commercial: [],

  magazine: [],

  personal: [],

  film: []

};

let currentProjectIndex = 0;


/* =========================================================
   HOME STATE
========================================================= */

let homeImages = [];

let currentHomeIndex = 0;


/* =========================================================
   NATURAL SORT
========================================================= */

function naturalSort(a, b) {

  return a.localeCompare(
    b,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );

}


/* =========================================================
   ENCODE GITHUB PATH
========================================================= */

function encodePath(path) {

  return path
    .split("/")
    .map(part =>
      encodeURIComponent(part)
    )
    .join("/");

}


/* =========================================================
   GITHUB API
========================================================= */

async function getGitHubContents(path) {

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `contents/${encodePath(path)}` +
    `?ref=${GITHUB_BRANCH}`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `GitHub API error: ${response.status}`
    );

  }


  return await response.json();

}


/* =========================================================
   IMAGE FILE CHECK
========================================================= */

function isImage(file) {

  if (
    !file ||
    !file.name
  ) {

    return false;

  }


  return /\.(jpg|jpeg|png|webp|gif|avif)$/i
    .test(file.name);

}


/* =========================================================
   LOAD HOME IMAGES
========================================================= */

async function loadHome() {

  try {

    const contents =
      await getGitHubContents(
        `${IMAGE_ROOT}/home`
      );


    homeImages =
      contents
        .filter(item =>
          item.type === "file"
        )
        .filter(isImage)
        .sort((a, b) =>
          naturalSort(
            a.name,
            b.name
          )
        );


    if (
      homeImages.length === 0
    ) {

      homeImage.style.display =
        "none";

      return;

    }


    currentHomeIndex = 0;

    showHomeImage();

  }

  catch (error) {

    console.error(
      "Home images could not be loaded:",
      error
    );

    homeImage.style.display =
      "none";

  }

}


/* =========================================================
   SHOW HOME IMAGE
========================================================= */

function showHomeImage() {

  if (
    !homeImages.length
  ) {

    return;

  }


  const image =
    homeImages[
      currentHomeIndex
    ];


  homeImage.src =
    image.download_url;

  homeImage.alt =
    image.name;

}


/* =========================================================
   NEXT HOME IMAGE
========================================================= */

function nextHomeImage() {

  if (
    homeImages.length <= 1
  ) {

    return;

  }


  currentHomeIndex =
    (
      currentHomeIndex + 1
    ) %
    homeImages.length;


  showHomeImage();

}


/* =========================================================
   HOME IMAGE CLICK
========================================================= */

homeImageWrap.addEventListener(
  "click",
  nextHomeImage
);


/* =========================================================
   LOAD CATEGORY
========================================================= */

async function loadCategory(
  category
) {

  try {

    const contents =
      await getGitHubContents(
        `${IMAGE_ROOT}/${category}`
      );


    const folders =
      contents
        .filter(item =>
          item.type === "dir"
        )
        .sort((a, b) =>
          naturalSort(
            a.name,
            b.name
          )
        );


    const projects = [];


    for (
      const folder of folders
    ) {

      try {

        const files =
          await getGitHubContents(
            folder.path
          );


        const images =
          files
            .filter(item =>
              item.type === "file"
            )
            .filter(isImage)
            .sort((a, b) =>
              naturalSort(
                a.name,
                b.name
              )
            );


        if (
          images.length > 0
        ) {

          projects.push({

            name:
              folder.name,

            path:
              folder.path,

            images:
              images

          });

        }

      }

      catch (error) {

        console.error(
          "Project could not be loaded:",
          folder.name,
          error
        );

      }

    }


    projectsByCategory[
      category
    ] = projects;


    renderProjectList(
      category
    );

  }

  catch (error) {

    console.error(
      "Category could not be loaded:",
      category,
      error
    );

    projectList.innerHTML = "";

  }

}


/* =========================================================
   RENDER PROJECT LIST
========================================================= */

function renderProjectList(
  category
) {

  projectList.innerHTML = "";


  const projects =
    projectsByCategory[
      category
    ] || [];


  projects.forEach(
    (project, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "project-item";


      button.textContent =
        project.name;


      button.addEventListener(
        "click",
        () => {

          openProject(
            category,
            index
          );

        }
      );


      projectList.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(
  category,
  index
) {

  const projects =
    projectsByCategory[
      category
    ] || [];


  const project =
    projects[index];


  if (!project) {

    return;

  }


  currentCategory =
    category;


  currentProjectIndex =
    index;


  /*
    홈 숨기기
  */

  home.style.display =
    "none";


  /*
    프로젝트 페이지 표시
  */

  detail.classList.add(
    "show"
  );


  /*
    메뉴 닫기
  */

  menuPanel.classList.remove(
    "show"
  );


  menuButton.textContent =
    "+";


  /*
    제목
  */

  detailCategory.textContent =
    capitalize(category);


  detailTitle.textContent =
    project.name;


  /*
    기존 이미지 제거
  */

  detailGrid.innerHTML =
    "";


  /*
    프로젝트 이미지 생성

    한 줄에 한 장.
    원본 비율 유지.
  */

  project.images.forEach(
    image => {

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "detail-image";


      img.src =
        image.download_url;


      img.alt =
        image.name;


      img.loading =
        "lazy";


      detailGrid.appendChild(
        img
      );

    }
  );


  /*
    페이지 맨 위
  */

  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(
  text
) {

  return (
    text.charAt(0).toUpperCase() +
    text.slice(1)
  );

}


/* =========================================================
   MENU BUTTON
========================================================= */

menuButton.addEventListener(
  "click",
  async () => {

    const isOpen =
      menuPanel.classList.contains(
        "show"
      );


    if (isOpen) {

      menuPanel.classList.remove(
        "show"
      );


      menuButton.textContent =
        "+";

    }

    else {

      menuPanel.classList.add(
        "show"
      );


      infoPanel.classList.remove(
        "show"
      );


      menuButton.textContent =
        "−";


      if (
        !projectsByCategory[
          currentCategory
        ].length
      ) {

        await loadCategory(
          currentCategory
        );

      }

      else {

        renderProjectList(
          currentCategory
        );

      }

    }

  }
);


/* =========================================================
   INFO BUTTON
========================================================= */

infoButton.addEventListener(
  "click",
  () => {

    infoPanel.classList.toggle(
      "show"
    );


    menuPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "+";

  }
);


/* =========================================================
   CATEGORY TABS
========================================================= */

document
  .querySelectorAll(
    ".menu-tab"
  )
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        async () => {

          const category =
            tab.dataset.category;


          currentCategory =
            category;


          document
            .querySelectorAll(
              ".menu-tab"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          tab.classList.add(
            "active"
          );


          if (
            !projectsByCategory[
              category
            ].length
          ) {

            await loadCategory(
              category
            );

          }

          else {

            renderProjectList(
              category
            );

          }

        }
      );

    }
  );


/* =========================================================
   LOGO → HOME
========================================================= */

logo.addEventListener(
  "click",
  event => {

    event.preventDefault();


    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    menuPanel.classList.remove(
      "show"
    );


    infoPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "+";


    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(
  "click",
  () => {

    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadHome();

</script>

</body>
</html>
