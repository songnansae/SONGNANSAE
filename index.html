<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        background: #fff;
        color: #000;
    }

    button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 52px;
        padding: 0 14px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        z-index: 1000;
        background: #fff;
    }

    .header-left {
        justify-self: start;
    }

    .header-center {
        justify-self: center;
    }

    .header-right {
        justify-self: end;
    }

    .menu-button {
        font-size: 20px;
        line-height: 1;
        width: 20px;
        text-align: left;
    }

    .logo {
        cursor: pointer;
        white-space: nowrap;
    }

    .info-button {
        cursor: pointer;
    }

    /* =========================
       INFO
    ========================= */

    .info-panel {
        position: fixed;
        top: 52px;
        right: 14px;
        width: 260px;
        z-index: 900;
        display: none;
        line-height: 1.35;
        background: #fff;
    }

    .info-panel.active {
        display: block;
    }

    .info-panel a {
        text-decoration: underline;
    }

    /* =========================
       MENU
    ========================= */

    .menu-panel {
        position: fixed;
        top: 52px;
        left: 14px;
        z-index: 900;
        display: none;
        background: #fff;
        line-height: 1.5;
    }

    .menu-panel.active {
        display: block;
    }

    .menu-category {
        margin-bottom: 12px;
    }

    .menu-category-title {
        cursor: pointer;
        margin-bottom: 4px;
    }

    .menu-project {
        display: block;
        cursor: pointer;
        margin-left: 12px;
        margin-bottom: 2px;
    }

    .menu-project:hover {
        text-decoration: underline;
    }

    /* =========================
       HOME
    ========================= */

    main {
        padding-top: 52px;
    }

    .home {
        min-height: calc(100vh - 52px);
        display: flex;
        flex-direction: column;
    }

    .home-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 0 14px;
    }

    .home-card {
        min-width: 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
    }

    .home-image {
        width: 100%;
        height: calc(100vh - 110px);
        object-fit: cover;
        display: block;
        background: #f2f2f2;
    }

    .home-image.loading {
        visibility: hidden;
    }

    .home-caption {
        padding-top: 7px;
        line-height: 1.25;
        min-height: 34px;
    }

    .home-caption-category {
        display: block;
    }

    .home-caption-project {
        display: block;
    }

    /* =========================
       DETAIL
    ========================= */

    .detail {
        display: none;
        padding: 0 14px 40px;
    }

    .detail.active {
        display: block;
    }

    .detail-header {
        padding: 15px 0 25px;
    }

    .detail-title {
        margin-bottom: 3px;
    }

    .detail-category {
        opacity: 0.6;
    }

    .detail-images {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .detail-images img {
        width: 100%;
        height: auto;
        display: block;
    }

    .back-button {
        margin-top: 30px;
        cursor: pointer;
    }

    .back-button:hover {
        text-decoration: underline;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty-card {
        width: 100%;
        height: calc(100vh - 110px);
        background: #f2f2f2;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .loading-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        header {
            height: 48px;
            padding: 0 10px;
        }

        main {
            padding-top: 48px;
        }

        .home {
            min-height: calc(100vh - 48px);
        }

        .home-grid {
            grid-template-columns: 1fr;
            gap: 25px;
            padding: 0 10px 30px;
        }

        .home-image,
        .empty-card {
            height: 65vh;
        }

        .home-caption {
            padding-top: 6px;
        }

        .info-panel {
            top: 48px;
            right: 10px;
        }

        .menu-panel {
            top: 48px;
            left: 10px;
        }

        .detail {
            padding: 0 10px 30px;
        }

        .detail-images {
            grid-template-columns: 1fr;
            gap: 8px;
        }
    }
</style>
</head>


<body>

<header>

    <div class="header-left">
        <button
            id="menuButton"
            class="menu-button"
            aria-label="Open menu"
        >+</button>
    </div>

    <div class="header-center">
        <div
            id="logo"
            class="logo"
            onclick="goHome()"
        >
            SONGNANSAE
        </div>
    </div>

    <div class="header-right">
        <button
            id="infoButton"
            class="info-button"
        >
            Info
        </button>
    </div>

</header>


<!-- =========================
     INFO PANEL
========================= -->

<div id="infoPanel" class="info-panel">

    <div>Commercial Photographer</div>
    <div>Seoul, Korea</div>
    <br>

    <div>For commissions and inquiries</div>

    <div>
        <a href="mailto:songnansae@gmail.com">
            songnansae@gmail.com
        </a>
    </div>

    <div>
        <a
            href="https://www.instagram.com/songnansae/"
            target="_blank"
        >
            Instagram
        </a>
    </div>

</div>


<!-- =========================
     MENU PANEL
========================= -->

<div id="menuPanel" class="menu-panel">

    <div class="menu-category">

        <div
            class="menu-category-title"
            onclick="showCategory('commercial')"
        >
            Commercial
        </div>

        <div id="commercialMenu"></div>

    </div>


    <div class="menu-category">

        <div
            class="menu-category-title"
            onclick="showCategory('magazine')"
        >
            Magazine
        </div>

        <div id="magazineMenu"></div>

    </div>


    <div class="menu-category">

        <div
            class="menu-category-title"
            onclick="showCategory('personal')"
        >
            Personal
        </div>

        <div id="personalMenu"></div>

    </div>


    <div class="menu-category">

        <div
            class="menu-category-title"
            onclick="showCategory('film')"
        >
            Film
        </div>

        <div id="filmMenu"></div>

    </div>

</div>


<main>

    <!-- =========================
         HOME
    ========================= -->

    <section
        id="home"
        class="home"
    >

        <div class="home-grid">

            <div
                id="commercialCard"
                class="home-card"
                onclick="nextProject('commercial')"
            >

                <div id="commercialImageContainer"></div>

                <div
                    id="commercialCaption"
                    class="home-caption"
                ></div>

            </div>


            <div
                id="magazineCard"
                class="home-card"
                onclick="nextProject('magazine')"
            >

                <div id="magazineImageContainer"></div>

                <div
                    id="magazineCaption"
                    class="home-caption"
                ></div>

            </div>


            <div
                id="personalCard"
                class="home-card"
                onclick="nextProject('personal')"
            >

                <div id="personalImageContainer"></div>

                <div
                    id="personalCaption"
                    class="home-caption"
                ></div>

            </div>

        </div>

    </section>


    <!-- =========================
         DETAIL
    ========================= -->

    <section
        id="detail"
        class="detail"
    >

        <div class="detail-header">

            <div
                id="detailTitle"
                class="detail-title"
            ></div>

            <div
                id="detailCategory"
                class="detail-category"
            ></div>

        </div>


        <div
            id="detailImages"
            class="detail-images"
        ></div>


        <div
            class="back-button"
            onclick="goHome()"
        >
            ← Back
        </div>

    </section>

</main>


<script>

/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "songnansae";
const GITHUB_REPO = "SONGNANSAE";
const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";


/* =========================================================
   CATEGORY
========================================================= */

const categories = [
    "commercial",
    "magazine",
    "personal",
    "film"
];


/* =========================================================
   DATA
========================================================= */

const projects = {

    commercial: [],
    magazine: [],
    personal: [],
    film: []

};


/* 현재 메인에서 몇 번째 프로젝트를 보여주는지 */

const currentIndex = {

    commercial: 0,
    magazine: 0,
    personal: 0

};


/* =========================================================
   GITHUB API URL
========================================================= */

function githubContentsURL(path) {

    const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return (
        "https://api.github.com/repos/" +
        GITHUB_OWNER +
        "/" +
        GITHUB_REPO +
        "/contents/" +
        encodedPath +
        "?ref=" +
        encodeURIComponent(GITHUB_BRANCH)
    );

}


/* =========================================================
   NATURAL SORT
========================================================= */

function naturalSort(a, b) {

    return a.localeCompare(
        b,
        undefined,
        {
            numeric: true,
            sensitivity: "base"
        }
    );

}


/* =========================================================
   GITHUB CONTENTS 가져오기
========================================================= */

async function getGitHubContents(path) {

    try {

        const response = await fetch(
            githubContentsURL(path)
        );

        if (!response.ok) {

            console.log(
                "GitHub API error:",
                path,
                response.status
            );

            return [];

        }

        const data = await response.json();

        if (!Array.isArray(data)) {

            return [];

        }

        return data;

    } catch (error) {

        console.log(
            "GitHub fetch error:",
            error
        );

        return [];

    }

}


/* =========================================================
   IMAGE CHECK
========================================================= */

function isImage(file) {

    if (!file || !file.name) {
        return false;
    }

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    return [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif"
    ].includes(extension);

}


/* =========================================================
   CATEGORY 불러오기
========================================================= */

async function loadCategory(category) {

    const categoryPath =
        `${IMAGE_ROOT}/${category}`;

    const contents =
        await getGitHubContents(categoryPath);


    /*
       images/category 안에서
       실제로 DIRECTORY인 것만 프로젝트로 사용
    */

    const folders = contents
        .filter(item => item.type === "dir")
        .sort((a, b) =>
            naturalSort(a.name, b.name)
        );


    const loadedProjects = [];


    for (const folder of folders) {

        const folderPath =
            `${categoryPath}/${folder.name}`;

        const files =
            await getGitHubContents(folderPath);


        /*
           실제 이미지 파일만 가져오기
        */

        const imageFiles = files
            .filter(file =>
                file.type === "file" &&
                isImage(file)
            )
            .sort((a, b) =>
                naturalSort(a.name, b.name)
            );


        /*
           사진이 하나도 없는 폴더는 표시하지 않음
        */

        if (imageFiles.length === 0) {
            continue;
        }


        loadedProjects.push({

            name: folder.name,

            category: category,

            images: imageFiles.map(file => ({

                name: file.name,

                url: file.download_url

            }))

        });

    }


    projects[category] =
        loadedProjects;

}


/* =========================================================
   전체 프로젝트 불러오기
========================================================= */

async function loadAllProjects() {

    document.body.classList.add("loading");


    await Promise.all(
        categories.map(category =>
            loadCategory(category)
        )
    );


    renderHome();

    renderMenu();


    document.body.classList.remove("loading");

}


/* =========================================================
   HOME RENDER
========================================================= */

function renderHome() {

    renderHomeCard(
        "commercial",
        "commercialImageContainer",
        "commercialCaption"
    );

    renderHomeCard(
        "magazine",
        "magazineImageContainer",
        "magazineCaption"
    );

    renderHomeCard(
        "personal",
        "personalImageContainer",
        "personalCaption"
    );

}


/* =========================================================
   HOME CARD 하나 렌더링
========================================================= */

function renderHomeCard(
    category,
    imageContainerId,
    captionId
) {

    const imageContainer =
        document.getElementById(
            imageContainerId
        );

    const caption =
        document.getElementById(
            captionId
        );


    imageContainer.innerHTML = "";
    caption.innerHTML = "";


    const categoryProjects =
        projects[category];


    /*
       해당 카테고리에
       프로젝트가 없으면 빈 화면
    */

    if (
        !categoryProjects ||
        categoryProjects.length === 0
    ) {

        imageContainer.innerHTML = `
            <div class="empty-card"></div>
        `;

        caption.innerHTML = `
            <span class="home-caption-category">
                ${capitalize(category)}
            </span>
        `;

        return;

    }


    /*
       현재 프로젝트
    */

    let index =
        currentIndex[category] %
        categoryProjects.length;


    const project =
        categoryProjects[index];


    /*
       프로젝트의 첫 번째 사진을
       메인 대표 이미지로 사용
    */

    const cover =
        project.images[0];


    if (!cover) {

        imageContainer.innerHTML = `
            <div class="empty-card"></div>
        `;

        return;

    }


    const img =
        document.createElement("img");

    img.className =
        "home-image loading";

    img.src =
        cover.url;

    img.alt =
        project.name;

    img.onload = () => {

        img.classList.remove("loading");

    };


    img.onerror = () => {

        img.style.display = "none";

        imageContainer.innerHTML = `
            <div class="empty-card"></div>
        `;

    };


    imageContainer.appendChild(img);


    /*
       캡션
    */

    caption.innerHTML = `

        <span class="home-caption-category">
            ${capitalize(category)}
        </span>

        <span class="home-caption-project">
            ${escapeHTML(project.name)}
        </span>

    `;

}


/* =========================================================
   메인 카드 클릭 → 다음 프로젝트
========================================================= */

function nextProject(category) {

    if (
        !projects[category] ||
        projects[category].length === 0
    ) {

        return;

    }


    currentIndex[category]++;


    if (
        currentIndex[category] >=
        projects[category].length
    ) {

        currentIndex[category] = 0;

    }


    renderHomeCard(
        category,
        `${category}ImageContainer`,
        `${category}Caption`
    );

}


/* =========================================================
   MENU RENDER
========================================================= */

function renderMenu() {

    categories.forEach(category => {

        const container =
            document.getElementById(
                `${category}Menu`
            );


        if (!container) {
            return;
        }


        container.innerHTML = "";


        projects[category].forEach(
            (project, index) => {

                const button =
                    document.createElement(
                        "div"
                    );


                button.className =
                    "menu-project";


                button.textContent =
                    project.name;


                button.onclick = () => {

                    openProject(
                        category,
                        index
                    );

                };


                container.appendChild(
                    button
                );

            }
        );

    });

}


/* =========================================================
   프로젝트 상세 페이지
========================================================= */

function openProject(
    category,
    index
) {

    const project =
        projects[category][index];


    if (!project) {
        return;
    }


    document.getElementById(
        "home"
    ).style.display = "none";


    document.getElementById(
        "detail"
    ).classList.add("active");


    document.getElementById(
        "detailTitle"
    ).textContent =
        project.name;


    document.getElementById(
        "detailCategory"
    ).textContent =
        capitalize(category);


    const detailImages =
        document.getElementById(
            "detailImages"
        );


    detailImages.innerHTML = "";


    project.images.forEach(image => {

        const img =
            document.createElement("img");


        img.src =
            image.url;


        img.alt =
            project.name;


        img.loading =
            "lazy";


        detailImages.appendChild(
            img
        );

    });


    closeMenu();

}


/* =========================================================
   CATEGORY 메뉴
========================================================= */

function showCategory(category) {

    /*
       프로젝트가 하나라도 있으면
       첫 번째 프로젝트 상세페이지로 이동
    */

    if (
        projects[category] &&
        projects[category].length > 0
    ) {

        openProject(
            category,
            0
        );

    }

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    document.getElementById(
        "detail"
    ).classList.remove("active");


    document.getElementById(
        "home"
    ).style.display = "";


    closeMenu();

}


/* =========================================================
   MENU OPEN / CLOSE
========================================================= */

const menuButton =
    document.getElementById(
        "menuButton"
    );


const menuPanel =
    document.getElementById(
        "menuPanel"
    );


menuButton.addEventListener(
    "click",
    () => {

        const isOpen =
            menuPanel.classList.contains(
                "active"
            );


        if (isOpen) {

            closeMenu();

        } else {

            openMenu();

        }

    }
);


function openMenu() {

    menuPanel.classList.add(
        "active"
    );

    menuButton.textContent =
        "−";

}


function closeMenu() {

    menuPanel.classList.remove(
        "active"
    );

    menuButton.textContent =
        "+";

}


/* =========================================================
   INFO
========================================================= */

const infoButton =
    document.getElementById(
        "infoButton"
    );


const infoPanel =
    document.getElementById(
        "infoPanel"
    );


infoButton.addEventListener(
    "click",
    () => {

        infoPanel.classList.toggle(
            "active"
        );

        closeMenu();

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(value) {

    return value.charAt(0).toUpperCase() +
        value.slice(1);

}


/* =========================================================
   시작
========================================================= */

loadAllProjects();

</script>

</body>
</html>
