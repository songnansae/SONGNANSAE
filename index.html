<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>

/* ========================================
   BASIC
======================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;

    font-size: 13px;
    font-weight: 400;

    background: #fff;
    color: #000;
}

button {
    font: inherit;
    color: inherit;

    background: none;
    border: 0;

    padding: 0;

    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}


/* ========================================
   HEADER
======================================== */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 52px;

    padding: 0 14px;

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    background: #fff;

    z-index: 1000;
}


.header-left {
    justify-self: start;
}


.header-center {
    justify-self: center;
}


.header-right {
    justify-self: end;
}


.menu-button {

    font-size: 20px;

    line-height: 1;

    width: 20px;

    text-align: left;
}


.logo {

    cursor: pointer;

    white-space: nowrap;
}


.info-button {
    cursor: pointer;
}



/* ========================================
   INFO
======================================== */

.info-panel {

    position: fixed;

    top: 52px;
    right: 14px;

    width: 260px;

    display: none;

    background: #fff;

    line-height: 1.35;

    z-index: 1100;
}


.info-panel.active {
    display: block;
}


.info-panel a {
    text-decoration: underline;
}



/* ========================================
   MENU
======================================== */

.menu-panel {

    position: fixed;

    top: 52px;
    left: 0;

    width: 100%;

    display: none;

    background: #fff;

    z-index: 900;

    padding:

        12px
        14px
        25px
        14px;
}


.menu-panel.active {
    display: block;
}


/* CATEGORY TABS */

.menu-tabs {

    display: flex;

    align-items: center;

    gap: 32px;

    margin-bottom: 13px;

    white-space: nowrap;
}


.menu-tab {

    cursor: pointer;

    opacity: 0.18;

    line-height: 1.2;
}


.menu-tab.active {

    opacity: 1;

    text-decoration: underline;

    text-underline-offset: 3px;
}


/* PROJECT LIST */

.menu-project-list {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    line-height: 1.55;
}


.menu-project {

    cursor: pointer;

    display: inline-block;
}


.menu-project:hover {
    text-decoration: underline;
}


.menu-empty {

    opacity: 0.35;
}



/* ========================================
   MAIN
======================================== */

main {
    padding-top: 52px;
}



/* ========================================
   HOME
======================================== */

.home {

    min-height: calc(100vh - 52px);
}


.home-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 10px;

    padding:
        0
        14px;
}


.home-card {

    min-width: 0;

    cursor: pointer;
}



/* ========================================
   HOME IMAGE — 4:5
======================================== */

.home-image {

    display: block;

    width: 100%;

    aspect-ratio: 4 / 5;

    height: auto;

    object-fit: cover;

    background: #f2f2f2;
}


.home-image.loading {
    visibility: hidden;
}


.empty-card {

    width: 100%;

    aspect-ratio: 4 / 5;

    background: #f2f2f2;
}



/* ========================================
   HOME CAPTION
======================================== */

.home-caption {

    padding-top: 7px;

    min-height: 40px;

    line-height: 1.25;
}


.home-caption-category {
    display: block;
}


.home-caption-project {
    display: block;
}



/* ========================================
   DETAIL
======================================== */

.detail {

    display: none;

    padding:
        0
        14px
        40px;
}


.detail.active {
    display: block;
}


.detail-header {

    padding:
        15px
        0
        25px;
}


.detail-title {

    margin-bottom: 3px;
}


.detail-category {

    opacity: 0.5;
}


.detail-images {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px;
}


.detail-images img {

    display: block;

    width: 100%;
    height: auto;
}


.back-button {

    display: inline-block;

    margin-top: 30px;

    cursor: pointer;
}


.back-button:hover {
    text-decoration: underline;
}



/* ========================================
   MOBILE
======================================== */

@media (max-width: 700px) {


    header {

        height: 48px;

        padding:
            0
            10px;
    }


    main {
        padding-top: 48px;
    }


    .info-panel {

        top: 48px;
        right: 10px;
    }


    .menu-panel {

        top: 48px;

        padding:

            12px
            10px
            22px;
    }


    .menu-tabs {

        gap: 25px;

        overflow-x: auto;

        scrollbar-width: none;
    }


    .menu-tabs::-webkit-scrollbar {
        display: none;
    }


    .home-grid {

        grid-template-columns: 1fr;

        gap: 28px;

        padding:
            0
            10px
            30px;
    }


    .home-image,
    .empty-card {

        aspect-ratio: 4 / 5;
    }


    .detail {

        padding:
            0
            10px
            30px;
    }


    .detail-images {

        grid-template-columns: 1fr;

        gap: 8px;
    }

}

</style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header>


<div class="header-left">

    <button
        id="menuButton"
        class="menu-button"
        aria-label="Open menu"
    >
        +
    </button>

</div>



<div class="header-center">

    <div
        class="logo"
        onclick="goHome()"
    >
        SONGNANSAE
    </div>

</div>



<div class="header-right">

    <button
        id="infoButton"
        class="info-button"
    >
        Info
    </button>

</div>


</header>



<!-- ========================================
     INFO
======================================== -->

<div
    id="infoPanel"
    class="info-panel"
>

    <div>
        Commercial Photographer
    </div>

    <div>
        Seoul, Korea
    </div>

    <br>

    <div>
        For commissions and inquiries
    </div>

    <div>

        <a
            href="mailto:songnansae@gmail.com"
        >
            songnansae@gmail.com
        </a>

    </div>

    <div>

        <a
            href="https://www.instagram.com/songnansae/"
            target="_blank"
        >
            Instagram
        </a>

    </div>

</div>



<!-- ========================================
     MENU
======================================== -->

<div
    id="menuPanel"
    class="menu-panel"
>


    <!-- CATEGORY -->

    <div class="menu-tabs">


        <button
            class="menu-tab active"
            data-category="commercial"
            onclick="selectMenuCategory('commercial')"
        >
            Commercial
        </button>


        <button
            class="menu-tab"
            data-category="magazine"
            onclick="selectMenuCategory('magazine')"
        >
            Magazine
        </button>


        <button
            class="menu-tab"
            data-category="personal"
            onclick="selectMenuCategory('personal')"
        >
            Personal
        </button>


        <button
            class="menu-tab"
            data-category="film"
            onclick="selectMenuCategory('film')"
        >
            Film
        </button>


    </div>



    <!-- PROJECTS -->

    <div
        id="menuProjectList"
        class="menu-project-list"
    ></div>


</div>



<!-- ========================================
     CONTENT
======================================== -->

<main>


<!-- ========================================
     HOME
======================================== -->

<section
    id="home"
    class="home"
>


<div class="home-grid">


    <!-- COMMERCIAL -->

    <div
        class="home-card"
        onclick="nextProject('commercial')"
    >

        <div
            id="commercialImageContainer"
        ></div>

        <div
            id="commercialCaption"
            class="home-caption"
        ></div>

    </div>



    <!-- MAGAZINE -->

    <div
        class="home-card"
        onclick="nextProject('magazine')"
    >

        <div
            id="magazineImageContainer"
        ></div>

        <div
            id="magazineCaption"
            class="home-caption"
        ></div>

    </div>



    <!-- PERSONAL -->

    <div
        class="home-card"
        onclick="nextProject('personal')"
    >

        <div
            id="personalImageContainer"
        ></div>

        <div
            id="personalCaption"
            class="home-caption"
        ></div>

    </div>


</div>


</section>



<!-- ========================================
     DETAIL
======================================== -->

<section
    id="detail"
    class="detail"
>


<div class="detail-header">

    <div
        id="detailTitle"
        class="detail-title"
    ></div>

    <div
        id="detailCategory"
        class="detail-category"
    ></div>

</div>



<div
    id="detailImages"
    class="detail-images"
></div>



<div
    class="back-button"
    onclick="goHome()"
>
    ← Back
</div>


</section>


</main>



<script>

/* ========================================
   GITHUB SETTINGS
======================================== */

const GITHUB_OWNER =
    "songnansae";


const GITHUB_REPO =
    "SONGNANSAE";


const GITHUB_BRANCH =
    "main";


const IMAGE_ROOT =
    "images";



/* ========================================
   CATEGORY
======================================== */

const categories = [

    "commercial",
    "magazine",
    "personal",
    "film"

];



/* ========================================
   PROJECT DATA
======================================== */

const projects = {

    commercial: [],

    magazine: [],

    personal: [],

    film: []

};



/* ========================================
   HOME CURRENT PROJECT
======================================== */

const currentIndex = {

    commercial: 0,

    magazine: 0,

    personal: 0

};



/* ========================================
   MENU CURRENT CATEGORY
======================================== */

let activeMenuCategory =
    "commercial";



/* ========================================
   GITHUB API URL
======================================== */

function githubContentsURL(path) {


    const encodedPath =

        path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");


    return (

        "https://api.github.com/repos/" +

        GITHUB_OWNER +

        "/" +

        GITHUB_REPO +

        "/contents/" +

        encodedPath +

        "?ref=" +

        encodeURIComponent(
            GITHUB_BRANCH
        )

    );

}



/* ========================================
   NATURAL SORT
======================================== */

function naturalSort(a, b) {


    return a.localeCompare(

        b,

        undefined,

        {

            numeric: true,

            sensitivity: "base"

        }

    );

}



/* ========================================
   GET GITHUB CONTENTS
======================================== */

async function getGitHubContents(path) {


    try {


        const response =

            await fetch(

                githubContentsURL(path)

            );


        if (!response.ok) {


            console.log(

                "GitHub API error:",

                path,

                response.status

            );


            return [];

        }


        const data =

            await response.json();


        if (!Array.isArray(data)) {

            return [];

        }


        return data;


    }


    catch (error) {


        console.log(

            "GitHub fetch error:",

            error

        );


        return [];

    }

}



/* ========================================
   IMAGE CHECK
======================================== */

function isImage(file) {


    if (

        !file ||

        !file.name

    ) {

        return false;

    }


    const extension =

        file.name
            .split(".")
            .pop()
            .toLowerCase();


    return [

        "jpg",

        "jpeg",

        "png",

        "webp",

        "gif"

    ].includes(extension);

}



/* ========================================
   LOAD CATEGORY
======================================== */

async function loadCategory(category) {


    const categoryPath =

        `${IMAGE_ROOT}/${category}`;


    const contents =

        await getGitHubContents(

            categoryPath

        );



    /* 실제 폴더만 */

    const folders =

        contents

            .filter(

                item =>
                    item.type === "dir"

            )

            .sort(

                (a, b) =>

                    naturalSort(

                        a.name,

                        b.name

                    )

            );



    const loadedProjects = [];



    for (

        const folder of folders

    ) {


        const folderPath =

            `${categoryPath}/${folder.name}`;



        const files =

            await getGitHubContents(

                folderPath

            );



        /* 실제 이미지 파일만 */

        const imageFiles =

            files

                .filter(

                    file =>

                        file.type === "file" &&

                        isImage(file)

                )

                .sort(

                    (a, b) =>

                        naturalSort(

                            a.name,

                            b.name

                        )

                );



        /* 빈 폴더 제외 */

        if (

            imageFiles.length === 0

        ) {

            continue;

        }



        loadedProjects.push({


            name:

                folder.name,


            category:

                category,


            images:

                imageFiles.map(

                    file => ({

                        name:
                            file.name,

                        url:
                            file.download_url

                    })

                )


        });

    }



    projects[category] =

        loadedProjects;

}



/* ========================================
   LOAD ALL
======================================== */

async function loadAllProjects() {


    await Promise.all(


        categories.map(

            category =>

                loadCategory(

                    category

                )

        )


    );



    renderHome();


    renderMenuProjects();

}



/* ========================================
   HOME
======================================== */

function renderHome() {


    renderHomeCard(

        "commercial",

        "commercialImageContainer",

        "commercialCaption"

    );


    renderHomeCard(

        "magazine",

        "magazineImageContainer",

        "magazineCaption"

    );


    renderHomeCard(

        "personal",

        "personalImageContainer",

        "personalCaption"

    );

}



/* ========================================
   HOME CARD
======================================== */

function renderHomeCard(

    category,

    imageContainerId,

    captionId

) {


    const imageContainer =

        document.getElementById(

            imageContainerId

        );


    const caption =

        document.getElementById(

            captionId

        );



    imageContainer.innerHTML = "";

    caption.innerHTML = "";



    const categoryProjects =

        projects[category];



    /* NO PROJECT */

    if (

        !categoryProjects ||

        categoryProjects.length === 0

    ) {


        imageContainer.innerHTML =

            `<div class="empty-card"></div>`;



        caption.innerHTML =

            `<span class="home-caption-category">
                ${capitalize(category)}
            </span>`;


        return;

    }



    const index =

        currentIndex[category] %

        categoryProjects.length;



    const project =

        categoryProjects[index];



    /* FIRST IMAGE = COVER */

    const cover =

        project.images[0];



    if (!cover) {


        imageContainer.innerHTML =

            `<div class="empty-card"></div>`;


        return;

    }



    const img =

        document.createElement(

            "img"

        );



    img.className =

        "home-image loading";



    img.src =

        cover.url;



    img.alt =

        project.name;



    img.onload = () => {


        img.classList.remove(

            "loading"

        );

    };



    img.onerror = () => {


        imageContainer.innerHTML =

            `<div class="empty-card"></div>`;

    };



    imageContainer.appendChild(

        img

    );



    caption.innerHTML = `

        <span
            class="home-caption-category"
        >
            ${capitalize(category)}
        </span>

        <span
            class="home-caption-project"
        >
            ${escapeHTML(project.name)}
        </span>

    `;

}



/* ========================================
   NEXT HOME PROJECT
======================================== */

function nextProject(category) {


    if (

        !projects[category] ||

        projects[category].length === 0

    ) {

        return;

    }



    currentIndex[category]++;



    if (

        currentIndex[category] >=

        projects[category].length

    ) {


        currentIndex[category] = 0;

    }



    renderHomeCard(

        category,

        `${category}ImageContainer`,

        `${category}Caption`

    );

}



/* ========================================
   MENU CATEGORY
======================================== */

function selectMenuCategory(category) {


    activeMenuCategory =

        category;



    document

        .querySelectorAll(

            ".menu-tab"

        )

        .forEach(

            tab => {


                if (

                    tab.dataset.category ===

                    category

                ) {


                    tab.classList.add(

                        "active"

                    );


                } else {


                    tab.classList.remove(

                        "active"

                    );

                }

            }

        );



    renderMenuProjects();

}



/* ========================================
   MENU PROJECT LIST
======================================== */

function renderMenuProjects() {


    const container =

        document.getElementById(

            "menuProjectList"

        );



    container.innerHTML = "";



    const categoryProjects =

        projects[activeMenuCategory];



    if (

        !categoryProjects ||

        categoryProjects.length === 0

    ) {


        const empty =

            document.createElement(

                "div"

            );


        empty.className =

            "menu-empty";


        empty.textContent =

            "";


        container.appendChild(

            empty

        );


        return;

    }



    categoryProjects.forEach(

        (project, index) => {


            const item =

                document.createElement(

                    "div"

                );


            item.className =

                "menu-project";


            item.textContent =

                project.name;



            item.onclick = () => {


                openProject(

                    activeMenuCategory,

                    index

                );

            };



            container.appendChild(

                item

            );

        }

    );

}



/* ========================================
   OPEN PROJECT
======================================== */

function openProject(

    category,

    index

) {


    const project =

        projects[category][index];



    if (!project) {

        return;

    }



    document.getElementById(

        "home"

    ).style.display =

        "none";



    document.getElementById(

        "detail"

    ).classList.add(

        "active"

    );



    document.getElementById(

        "detailTitle"

    ).textContent =

        project.name;



    document.getElementById(

        "detailCategory"

    ).textContent =

        capitalize(category);



    const detailImages =

        document.getElementById(

            "detailImages"

        );



    detailImages.innerHTML = "";



    project.images.forEach(

        image => {


            const img =

                document.createElement(

                    "img"

                );


            img.src =

                image.url;


            img.alt =

                project.name;


            img.loading =

                "lazy";


            detailImages.appendChild(

                img

            );

        }

    );



    closeMenu();


    window.scrollTo(

        0,

        0

    );

}



/* ========================================
   HOME
======================================== */

function goHome() {


    document.getElementById(

        "detail"

    ).classList.remove(

        "active"

    );



    document.getElementById(

        "home"

    ).style.display =

        "";



    closeMenu();


    window.scrollTo(

        0,

        0

    );

}



/* ========================================
   MENU OPEN / CLOSE
======================================== */

const menuButton =

    document.getElementById(

        "menuButton"

    );


const menuPanel =

    document.getElementById(

        "menuPanel"

    );



menuButton.addEventListener(

    "click",

    () => {


        const open =

            menuPanel.classList.contains(

                "active"

            );



        if (open) {


            closeMenu();


        } else {


            openMenu();

        }

    }

);



function openMenu() {


    menuPanel.classList.add(

        "active"

    );


    menuButton.textContent =

        "−";


    infoPanel.classList.remove(

        "active"

    );


    renderMenuProjects();

}



function closeMenu() {


    menuPanel.classList.remove(

        "active"

    );


    menuButton.textContent =

        "+";

}



/* ========================================
   INFO
======================================== */

const infoButton =

    document.getElementById(

        "infoButton"

    );


const infoPanel =

    document.getElementById(

        "infoPanel"

    );



infoButton.addEventListener(

    "click",

    () => {


        const isOpen =

            infoPanel.classList.contains(

                "active"

            );



        closeMenu();



        if (isOpen) {


            infoPanel.classList.remove(

                "active"

            );


        } else {


            infoPanel.classList.add(

                "active"

            );

        }

    }

);



/* ========================================
   ESCAPE
======================================== */

function escapeHTML(value) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ========================================
   CAPITALIZE
======================================== */

function capitalize(value) {


    return (

        value
            .charAt(0)
            .toUpperCase()

        +

        value.slice(1)

    );

}



/* ========================================
   START
======================================== */

loadAllProjects();

</script>


</body>
</html>
