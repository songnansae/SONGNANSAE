<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #fff;
    color: #111;

    font-family:
        Helvetica,
        Arial,
        sans-serif;

    font-size: 13px;
    font-weight: 400;
}


/* =========================
   HEADER
========================= */

.header {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 42px;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;
}


/* 왼쪽 + - */

.menu-button {
    position: absolute;

    left: 12px;
    top: 10px;

    display: flex;
    gap: 10px;

    font-size: 20px;
    line-height: 1;

    cursor: pointer;

    user-select: none;
}

.menu-button span {
    display: block;
}

.minus {
    color: #ccc;
}


/* 가운데 SONGNANSAE */

.logo {
    position: absolute;

    left: 50%;
    transform: translateX(-50%);

    font-size: 13px;
    font-weight: 400;

    cursor: pointer;

    white-space: nowrap;
}


/* 오른쪽 INFO */

.info-button {
    position: absolute;

    right: 20px;
    top: 11px;

    font-size: 13px;

    cursor: pointer;
}


/* =========================
   MENU
========================= */

.menu {
    position: fixed;

    top: 42px;
    left: 0;

    width: 100%;

    padding: 25px 30px 18px;

    background: #fff;

    z-index: 90;

    display: none;

    border-bottom: 1px solid #111;
}

.menu.open {
    display: block;
}

.menu-items {
    display: flex;
    gap: 42px;

    align-items: center;
}

.menu-items a {
    color: #111;

    text-decoration: none;

    font-size: 13px;
    font-weight: 400;

    cursor: pointer;
}

.menu-items a:hover {
    text-decoration: underline;
}


/* =========================
   HOME
========================= */

.home {
    width: 100%;

    padding-top: 42px;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
}


/* 사진 3장 */

.home-grid {
    flex: 1;

    width: 100%;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 0;

    align-items: stretch;
}

.home-item {
    position: relative;

    width: 100%;
    height: calc(100vh - 82px);

    overflow: hidden;

    cursor: pointer;
}

.home-item img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================
   HOME BOTTOM TITLES
========================= */

.home-caption {
    width: 100%;

    height: 40px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    align-items: center;

    background: #fff;

    font-size: 13px;
}

.home-caption div {
    padding: 0 4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   CATEGORY PAGE
========================= */

.page {
    display: none;

    padding-top: 42px;

    min-height: 100vh;
}

.page.active {
    display: block;
}


/* 카테고리 상단 */

.page-header {
    padding: 30px;

    font-size: 13px;
}


/* 프로젝트 리스트 */

.project-list {
    padding: 0 30px 60px;
}

.project {
    margin-bottom: 14px;

    font-size: 13px;

    cursor: pointer;
}

.project:hover {
    text-decoration: underline;
}


/* =========================
   PROJECT DETAIL
========================= */

.project-page {
    display: none;

    padding-top: 42px;

    min-height: 100vh;
}

.project-page.active {
    display: block;
}

.back {
    padding: 30px;

    font-size: 13px;

    cursor: pointer;
}

.project-title {
    padding: 0 30px 30px;

    font-size: 13px;
}


/* 사진 */

.project-images {
    width: 100%;
}

.project-images img {
    display: block;

    width: 100%;

    height: auto;

    margin: 0;
}


/* =========================
   INFO
========================= */

.info-page {
    display: none;

    position: fixed;

    top: 42px;
    left: 0;

    width: 100%;
    height: calc(100vh - 42px);

    background: #fff;

    z-index: 80;
}

.info-page.active {
    display: block;
}

.info-inner {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: flex-start;
    justify-content: flex-start;

    padding: 70px 30px;
}

.info-text {
    font-size: 13px;

    line-height: 1.5;
}

.info-text a {
    color: #111;

    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .home-grid {
        grid-template-columns: 1fr;
    }

    .home-item {
        height: 70vh;
    }

    .home-caption {
        grid-template-columns: 1fr;

        height: auto;
    }

    .home-caption div {
        height: 30px;

        display: flex;
        align-items: center;
    }

    .menu-items {
        gap: 25px;
    }

    .project-images img {
        width: 100%;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="menu-button" onclick="toggleMenu()">
        <span>+</span>
        <span class="minus">−</span>
    </div>


    <!-- 클릭하면 홈으로 -->

    <div class="logo" onclick="goHome()">
        SONGNANSAE
    </div>


    <div class="info-button" onclick="openInfo()">
        Info
    </div>

</header>



<!-- =========================
     MENU
========================= -->

<nav class="menu" id="menu">

    <div class="menu-items">

        <a onclick="showCategory('commercial')">
            Commercial
        </a>

        <a onclick="showCategory('magazine')">
            Magazine
        </a>

        <a onclick="showCategory('personal')">
            Personal
        </a>

        <a onclick="showCategory('film')">
            Film
        </a>

    </div>

</nav>



<!-- =========================
     HOME
========================= -->

<main class="home" id="home">


    <div class="home-grid">


        <!-- COMMERCIAL -->

        <div
            class="home-item"
            onclick="showCategory('commercial')"
        >

            <img
                src="images/commercial/main.jpg"
                alt="Commercial"
                onerror="this.style.display='none';"
            >

        </div>



        <!-- MAGAZINE -->

        <div
            class="home-item"
            onclick="openProject(
                'magazine',
                'The Neighbor, 2026'
            )"
        >

            <img
                src="images/magazine/The Neighbor , 2026/0080_THE NEIGHBOR_260611_R1.JPG"
                alt="Magazine"
                onerror="this.style.display='none';"
            >

        </div>



        <!-- PERSONAL -->

        <div
            class="home-item"
            onclick="showCategory('personal')"
        >

            <img
                src="images/personal/main.jpg"
                alt="Personal"
                onerror="this.style.display='none';"
            >

        </div>

    </div>



    <!-- 화면 맨 아래 -->

    <div class="home-caption">

        <div onclick="showCategory('commercial')">
            Commercial
        </div>

        <div onclick="openProject(
            'magazine',
            'The Neighbor, 2026'
        )">
            Magazine, The Neighbor, 2026
        </div>

        <div onclick="showCategory('personal')">
            Personal
        </div>

    </div>

</main>



<!-- =========================
     CATEGORY PAGE
========================= -->

<section
    class="page"
    id="categoryPage"
>

    <div
        class="page-header"
        id="categoryTitle"
    ></div>


    <div
        class="project-list"
        id="projectList"
    ></div>

</section>



<!-- =========================
     PROJECT DETAIL
========================= -->

<section
    class="project-page"
    id="projectPage"
>

    <div
        class="back"
        onclick="goBack()"
    >
        ← Back
    </div>


    <div
        class="project-title"
        id="projectTitle"
    ></div>


    <div
        class="project-images"
        id="projectImages"
    ></div>

</section>



<!-- =========================
     INFO
========================= -->

<section
    class="info-page"
    id="infoPage"
>

    <div class="info-inner">

        <div class="info-text">

            <div>SONGNANSAE</div>

            <br>

            <div>
                Commercial Photographer
            </div>

            <div>
                Seoul, Korea
            </div>

            <br>

            <div>
                For commissions and inquiries
            </div>

            <div>
                <a href="mailto:songnansae@gmail.com">
                    songnansae@gmail.com
                </a>
            </div>

            <br>

            <div>
                <a
                    href="https://www.instagram.com/songnansae/"
                    target="_blank"
                >
                    Instagram
                </a>
            </div>

        </div>

    </div>

</section>



<script>

/* ==================================================
   PROJECT DATA
================================================== */


/*
   여기서 작업을 추가하면 됨.

   지금은 네가 실제로 만든
   The Neighbor, 2026
   하나만 넣어둠.
*/


const projects = {

    commercial: [

        /*
        {
            title: "RUNHER, 2026",
            folder: "RUNHER, 2026",
            images: [
                "01.jpg",
                "02.jpg",
                "03.jpg"
            ]
        }
        */

    ],


    magazine: [

        {
            title: "The Neighbor, 2026",

            folder: "The Neighbor , 2026",

            images: [

                "0080_THE NEIGHBOR_260611_R1.JPG",

                "0403_THE NEIGHBOR_260611_R1.JPG",

                "0909_THE NEIGHBOR_260611_R1.JPG",

                "0948_THE NEIGHBOR_260611_R1.JPG",

                "1299_THE NEIGHBOR_260611_R1.jpg",

                "1559_THE NEIGHBOR_260611_R1(수정).JPG",

                "1771_THE NEIGHBOR_260611_R2(수정).JPG",

                "2306_THE NEIGHBOR_260611_R1.JPG"

            ]
        }

    ],


    personal: [

        /*
        {
            title: "Personal Work, 2026",
            folder: "Personal Work, 2026",
            images: [
                "01.jpg",
                "02.jpg",
                "03.jpg"
            ]
        }
        */

    ],


    film: [

        /*
        {
            title: "Film Work, 2026",
            folder: "Film Work, 2026",
            images: [
                "01.jpg",
                "02.jpg"
            ]
        }
        */

    ]

};



/* ==================================================
   MENU
================================================== */

function toggleMenu() {

    const menu =
        document.getElementById("menu");

    menu.classList.toggle("open");

}



/* ==================================================
   HOME
================================================== */

function goHome() {

    document
        .getElementById("home")
        .style.display = "flex";

    document
        .getElementById("categoryPage")
        .classList.remove("active");

    document
        .getElementById("projectPage")
        .classList.remove("active");

    document
        .getElementById("infoPage")
        .classList.remove("active");

    document
        .getElementById("menu")
        .classList.remove("open");

    window.scrollTo(0, 0);

}



/* ==================================================
   CATEGORY
================================================== */

function showCategory(category) {

    document
        .getElementById("home")
        .style.display = "none";

    document
        .getElementById("projectPage")
        .classList.remove("active");

    document
        .getElementById("infoPage")
        .classList.remove("active");

    document
        .getElementById("categoryPage")
        .classList.add("active");

    document
        .getElementById("menu")
        .classList.remove("open");


    const title =
        document.getElementById("categoryTitle");

    const list =
        document.getElementById("projectList");


    title.innerHTML =
        category.charAt(0).toUpperCase()
        + category.slice(1);


    list.innerHTML = "";


    const categoryProjects =
        projects[category] || [];


    if (categoryProjects.length === 0) {

        list.innerHTML =
            '<div style="color:#999;">No projects yet.</div>';

        return;
    }


    categoryProjects.forEach(project => {

        const item =
            document.createElement("div");

        item.className = "project";

        item.textContent =
            project.title;


        item.onclick = function() {

            openProject(
                category,
                project.title
            );

        };


        list.appendChild(item);

    });

}



/* ==================================================
   OPEN PROJECT
================================================== */

function openProject(
    category,
    title
) {

    document
        .getElementById("home")
        .style.display = "none";

    document
        .getElementById("categoryPage")
        .classList.remove("active");

    document
        .getElementById("infoPage")
        .classList.remove("active");

    document
        .getElementById("menu")
        .classList.remove("open");


    const project =
        projects[category]
        .find(item => item.title === title);


    if (!project) {

        return;

    }


    const projectPage =
        document.getElementById("projectPage");

    const projectTitle =
        document.getElementById("projectTitle");

    const projectImages =
        document.getElementById("projectImages");


    projectPage.classList.add("active");


    projectTitle.textContent =
        project.title;


    projectImages.innerHTML = "";


    project.images.forEach(filename => {

        const img =
            document.createElement("img");


        img.src =
            "images/"
            + category
            + "/"
            + project.folder
            + "/"
            + filename;


        img.alt =
            project.title;


        projectImages.appendChild(img);

    });


    window.scrollTo(0, 0);

}



/* ==================================================
   BACK
================================================== */

function goBack() {

    document
        .getElementById("projectPage")
        .classList.remove("active");

    document
        .getElementById("categoryPage")
        .classList.add("active");

    window.scrollTo(0, 0);

}



/* ==================================================
   INFO
================================================== */

function openInfo() {

    document
        .getElementById("home")
        .style.display = "none";

    document
        .getElementById("categoryPage")
        .classList.remove("active");

    document
        .getElementById("projectPage")
        .classList.remove("active");

    document
        .getElementById("infoPage")
        .classList.add("active");

    document
        .getElementById("menu")
        .classList.remove("open");

    window.scrollTo(0, 0);

}

</script>

</body>
</html>
