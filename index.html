<style>
* {
  box-sizing: border-box;
}

html,

  padding: 0;

  color: #111;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
}

body {
  overflow-x: hidden;

/* =========================
   HEADER
========================= */

  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 52px;
  z-index: 1000;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 0 14px;

}

  border: 0;
  background: none;
  padding: 0;
  margin: 0;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;
}

.menu-button {
  justify-self: start;
}

.info-button {
  justify-self: end;

  justify-self: center;

========================= */

  display: none;

  position: fixed;
  top: 52px;
  right: 14px;
  z-index: 900;

  width: 260px;

  background: #fff;

  font-size: 13px;
  line-height: 1.4;
}

.info-panel.show {
  display: block;
}

  color: #111;
  text-decoration: none;

  text-decoration: underline;

/* =========================

========================= */

  display: none;

  position: fixed;
  top: 52px;
  left: 14px;
  z-index: 900;

  width: 560px;

  background: #fff;
}

.menu-panel.show {
  display: block;
}

.menu-tabs {
  display: flex;
  gap: 28px;
  margin-bottom: 20px;
}

.menu-tab {
  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.menu-tab.active {
  text-decoration: underline;
}

/* =========================
   PROJECT LIST
========================= */

.project-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.project-item {
  border: 0;
  background: none;

  padding: 0;

  text-align: left;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.project-item:hover {
  text-decoration: underline;
}

/* =========================
   HOME
========================= */

main {
  padding-top: 52px;
}

.home {
  width: 100%;
  min-height: calc(100vh - 52px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
}

.home-image-wrap {
  width: 100%;
  height: calc(100vh - 52px);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  padding: 0;
}

.home-image {
  display: block;

  max-width: 68%;
  max-height: calc(100vh - 150px);

  width: auto;
  height: auto;

  object-fit: contain;
  object-position: center;

  user-select: none;
  -webkit-user-drag: none;
}

/* =========================
   DETAIL
========================= */

.detail {
  display: none;

  padding: 78px 14px 40px;
}

.detail.show {
  display: block;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;

  margin-bottom: 24px;
}

.detail-title,
.detail-category {
  font-size: 13px;
}

.detail-grid {
  display: flex;
  flex-direction: column;
  align-items: center;

  width: 100%;

  gap: 30px;
}

.detail-image {
  display: block;

  max-width: 90%;
  max-height: calc(100vh - 190px);

  width: auto;
  height: auto;

  object-fit: contain;
  object-position: center;

  margin: 0 auto;
  padding: 0;
}

.back-button {
  margin-top: 40px;

  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.back-button:hover {
  text-decoration: underline;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: 48px;
    padding: 0 12px;
  }

  main {
    padding-top: 48px;
  }

  .info-panel {
    top: 48px;
    right: 12px;
  }

  .menu-panel {
    top: 48px;
    left: 12px;
    width: calc(100% - 24px);
  }

  .menu-tabs {
    gap: 22px;
  }

  .home {
    min-height: calc(100vh - 48px);
  }

  .home-image-wrap {
    height: calc(100vh - 48px);
  }

  .home-image {
    max-width: 90%;
    max-height: calc(100vh - 120px);
  }

  .detail {

  }

  .detail-grid {
    gap: 20px;
  }

  .detail-image {
    max-width: 92%;
    max-height: calc(100vh - 150px);
  }
}

<script>

/* =========================================================
   SETTINGS
========================================================= */

const GITHUB_OWNER = "songnansae";
const GITHUB_REPO = "SONGNANSAE";
const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";

const categories = [
  "commercial",
  "magazine",
  "personal",
  "film"
];


/* =========================================================
   ELEMENTS
========================================================= */

const menuButton =
  document.getElementById("menuButton");

const logo =
  document.getElementById("logo");

const infoButton =
  document.getElementById("infoButton");

const menuPanel =
  document.getElementById("menuPanel");

const infoPanel =
  document.getElementById("infoPanel");

const projectList =
  document.getElementById("projectList");

const home =
  document.getElementById("home");

const homeImage =
  document.getElementById("homeImage");

const homeImageWrap =
  document.getElementById("homeImageWrap");

const detail =
  document.getElementById("detail");

const detailCategory =
  document.getElementById("detailCategory");

const detailTitle =
  document.getElementById("detailTitle");

const detailGrid =
  document.getElementById("detailGrid");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   DATA
========================================================= */

let currentCategory = "commercial";

let projectsByCategory = {
  commercial: [],
  magazine: [],
  personal: [],
  film: []
};

let currentProjectIndex = 0;

let homeImages = [];

let currentHomeIndex = 0;

let githubTree = null;


/* =========================================================
   HELPERS
========================================================= */

function naturalSort(a, b) {

  return a.localeCompare(
    b,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );

}


/*
  01_the vinylhouse , 2024

  →
  
  the vinylhouse , 2024
*/

function displayProjectName(name) {

  return name.replace(
    /^\d+[_\-\.\s]+/,
    ""
  );

}


/*
  폴더 앞의 번호 추출

  01_xxx → 1
  02_xxx → 2
*/

function extractOrder(name) {

  const match =
    name.match(/^(\d+)/);

  if (!match) {
    return 999999;
  }

  return parseInt(
    match[1],
    10
  );

}


/*
  프로젝트 이름에서 연도 추출

  예:
  "Pesade, 2024"
  → 2024
*/

function extractYear(name) {

  const match =
    name.match(
      /(?:^|[\s,_\-])((?:19|20)\d{2})(?:$|[\s,_\-])/
    );

  if (!match) {
    return null;
  }

  return parseInt(
    match[1],
    10
  );

}


/*
  이미지 파일인지 확인
*/

function isImagePath(path) {

  return /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(path);

}


/*
  GitHub Raw 이미지 URL
*/

function getRawImageUrl(path) {

  const encodedPath =
    path
      .split("/")
      .map(part =>
        encodeURIComponent(part)
      )
      .join("/");

  return (
    "https://raw.githubusercontent.com/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/" +
    GITHUB_BRANCH +
    "/" +
    encodedPath
  );

}


/* =========================================================
   HOME SORT
========================================================= */

/*
  숫자로 시작하는 파일을 먼저.

  01.jpg
  02.jpg
  03.jpg
  _DSF1582.jpg
*/

function homeSort(a, b) {

  const aName = a.name;
  const bName = b.name;

  const aMatch =
    aName.match(/^(\d+)/);

  const bMatch =
    bName.match(/^(\d+)/);


  if (aMatch && bMatch) {

    const aNumber =
      parseInt(
        aMatch[1],
        10
      );

    const bNumber =
      parseInt(
        bMatch[1],
        10
      );


    if (aNumber !== bNumber) {
      return aNumber - bNumber;
    }

  }


  if (aMatch && !bMatch) {
    return -1;
  }


  if (!aMatch && bMatch) {
    return 1;
  }


  return naturalSort(
    aName,
    bName
  );

}


/* =========================================================
   LOAD GITHUB TREE
========================================================= */

/*
  GitHub API를 프로젝트마다 요청하지 않고
  전체 파일 구조를 한 번만 가져온다.
*/

async function loadGithubTree() {

  if (githubTree) {
    return githubTree;
  }


  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `git/trees/${GITHUB_BRANCH}?recursive=1`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `GitHub API error: ${response.status}`
    );

  }


  const data =
    await response.json();


  if (data.truncated) {

    console.warn(
      "GitHub tree response was truncated."
    );

  }


  githubTree =
    data.tree || [];


  return githubTree;

}


/* =========================================================
   LOAD HOME
========================================================= */

async function loadHome() {

  try {

    const tree =
      await loadGithubTree();


    const homePrefix =
      `${IMAGE_ROOT}/home/`;


    homeImages =
      tree

        .filter(item =>
          item.type === "blob"
        )

        .filter(item =>
          item.path.startsWith(
            homePrefix
          )
        )

        .filter(item => {

          const relativePath =
            item.path.slice(
              homePrefix.length
            );

          return !relativePath.includes("/");
        })

        .filter(item =>
          isImagePath(item.path)
        )

        .map(item => {

          const fileName =
            item.path.slice(
              homePrefix.length
            );

          return {
            name: fileName,
            path: item.path,
            download_url:
              getRawImageUrl(
                item.path
              )
          };

        })

        .sort(homeSort);


    if (homeImages.length === 0) {

      homeImage.style.display =
        "none";

      return;

    }


    currentHomeIndex = 0;

    showHomeImage();


  } catch (error) {

    console.error(
      "Home images could not be loaded:",
      error
    );

    homeImage.style.display =
      "none";

  }

}


/* =========================================================
   SHOW HOME IMAGE
========================================================= */

function showHomeImage() {

  if (!homeImages.length) {
    return;
  }


  const image =
    homeImages[
      currentHomeIndex
    ];


  homeImage.src =
    image.download_url;

  homeImage.alt =
    image.name;

}


/* =========================================================
   NEXT HOME IMAGE
========================================================= */

function nextHomeImage() {

  if (homeImages.length <= 1) {
    return;
  }


  currentHomeIndex =
    (
      currentHomeIndex + 1
    ) % homeImages.length;


  showHomeImage();

}


homeImageWrap.addEventListener(
  "click",
  nextHomeImage
);


/* =========================================================
   LOAD ALL PROJECTS
========================================================= */

async function loadAllProjects() {

  const tree =
    await loadGithubTree();


  const projectMap = {};


  categories.forEach(
    category => {

      projectMap[category] = {};

    }
  );


  tree.forEach(item => {

    if (item.type !== "blob") {
      return;
    }


    if (!isImagePath(item.path)) {
      return;
    }


    const parts =
      item.path.split("/");


    /*
      images
      /
      category
      /
      project
      /
      image
    */

    if (parts.length < 4) {
      return;
    }


    if (
      parts[0] !== IMAGE_ROOT
    ) {
      return;
    }


    const category =
      parts[1];


    if (
      !categories.includes(
        category
      )
    ) {
      return;
    }


    const projectName =
      parts[2];


    const projectPath =
      `${IMAGE_ROOT}/${category}/${projectName}`;


    if (
      !projectMap[
        category
      ][projectPath]
    ) {

      projectMap[
        category
      ][projectPath] = {

        name: projectName,

        path: projectPath,

        images: []

      };

    }


    projectMap[
      category
    ][projectPath]
      .images
      .push({

        name:
          parts[
            parts.length - 1
          ],

        path:
          item.path,

        download_url:
          getRawImageUrl(
            item.path
          )

      });

  });


  /* =========================
     CATEGORY DATA
  ========================= */

  categories.forEach(
    category => {

      projectsByCategory[
        category
      ] =
        Object.values(
          projectMap[
            category
          ]
        );


      /*
        프로젝트 내부 이미지
        자연스러운 파일명 순서
      */

      projectsByCategory[
        category
      ].forEach(
        project => {

          project.images.sort(
            (a, b) =>
              naturalSort(
                a.name,
                b.name
              )
          );

        }
      );


      /*
        핵심 정렬

        1. 연도 최신순
        2. 같은 연도 안에서는
           01 → 02 → 03 순서
      */

      projectsByCategory[
        category
      ].sort(
        (a, b) => {

          const yearA =
            extractYear(
              a.name
            );

          const yearB =
            extractYear(
              b.name
            );


          /*
            연도가 둘 다 있으면
            최신 연도 먼저
          */

          if (
            yearA !== null &&
            yearB !== null &&
            yearA !== yearB
          ) {

            return yearB - yearA;

          }


          /*
            연도 없는 프로젝트는
            아래쪽으로
          */

          if (
            yearA === null &&
            yearB !== null
          ) {

            return 1;

          }


          if (
            yearA !== null &&
            yearB === null
          ) {

            return -1;

          }


          /*
            같은 연도에서는
            폴더 앞 번호 순서 유지
          */

          return (
            extractOrder(a.name) -
            extractOrder(b.name)
          );

        }
      );

    }
  );

}


/* =========================================================
   RENDER PROJECT LIST
========================================================= */

/*
  여기서는 연도 제목을 만들지 않는다.

  그냥 정렬된 프로젝트를
  그대로 한 줄씩 출력한다.
*/

function renderProjectList(
  category
) {

  projectList.innerHTML = "";


  const projects =
    projectsByCategory[
      category
    ] || [];


  projects.forEach(
    (project, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "project-item";


      button.textContent =
        displayProjectName(
          project.name
        );


      button.addEventListener(
        "click",
        () => {

          openProject(
            category,
            index
          );

        }
      );


      projectList.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(
  category,
  index
) {

  const projects =
    projectsByCategory[
      category
    ] || [];


  const project =
    projects[index];


  if (!project) {
    return;
  }


  currentCategory =
    category;

  currentProjectIndex =
    index;


  home.style.display =
    "none";


  detail.classList.add(
    "show"
  );


  menuPanel.classList.remove(
    "show"
  );


  menuButton.textContent =
    "+";


  detailCategory.textContent =
    capitalize(
      category
    );


  detailTitle.textContent =
    displayProjectName(
      project.name
    );


  detailGrid.innerHTML =
    "";


  project.images.forEach(
    (image, index) => {

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "detail-image";


      img.src =
        image.download_url;


      img.alt =
        image.name;


      /*
        첫 번째 사진은 즉시,
        나머지는 lazy loading.
      */

      if (index !== 0) {

        img.loading =
          "lazy";

      }


      detailGrid.appendChild(
        img
      );

    }
  );


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text) {

  return (
    text.charAt(0).toUpperCase() +
    text.slice(1)
  );

}


/* =========================================================
   MENU BUTTON
========================================================= */

menuButton.addEventListener(
  "click",
  async () => {

    const isOpen =
      menuPanel.classList.contains(
        "show"
      );


    if (isOpen) {

      menuPanel.classList.remove(
        "show"
      );

      menuButton.textContent =
        "+";

      return;

    }


    menuPanel.classList.add(
      "show"
    );


    infoPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "−";


    /*
      데이터가 아직 없다면
      한 번만 로드.
    */

    if (
      !projectsByCategory[
        currentCategory
      ].length
    ) {

      try {

        await loadAllProjects();

      } catch (error) {

        console.error(
          "Projects could not be loaded:",
          error
        );

      }

    }


    renderProjectList(
      currentCategory
    );

  }
);


/* =========================================================
   INFO BUTTON
========================================================= */

infoButton.addEventListener(
  "click",
  () => {

    infoPanel.classList.toggle(
      "show"
    );


    menuPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "+";

  }
);


/* =========================================================
   CATEGORY TABS
========================================================= */

document
  .querySelectorAll(
    ".menu-tab"
  )
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        async () => {

          const category =
            tab.dataset.category;


          currentCategory =
            category;


          document
            .querySelectorAll(
              ".menu-tab"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          tab.classList.add(
            "active"
          );


          /*
            이미 데이터가 있으면
            GitHub API를 다시 호출하지 않음.
          */

          if (
            !projectsByCategory[
              category
            ].length
          ) {

            try {

              await loadAllProjects();

            } catch (error) {

              console.error(
                error
              );

            }

          }


          renderProjectList(
            category
          );

        }
      );

    }
  );


/* =========================================================
   LOGO → HOME
========================================================= */

logo.addEventListener(
  "click",
  event => {

    event.preventDefault();


    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    menuPanel.classList.remove(
      "show"
    );


    infoPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "+";


    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
  "click",
  () => {

    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeSite() {

  try {

    /*
      GitHub Tree와 Home을
      동시에 준비
    */

    await Promise.all([
      loadGithubTree(),
      loadHome()
    ]);


    /*
      전체 프로젝트 정보 구성
    */

    await loadAllProjects();


    /*
      처음 메뉴를 열면
      바로 표시할 수 있도록 준비
    */

    renderProjectList(
      currentCategory
    );


  } catch (error) {

    console.error(
      "Site initialization failed:",
      error
    );

  }

}


initializeSite();

</script>
