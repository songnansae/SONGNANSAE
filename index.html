<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SONGNANSAE</title>


<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #fff;
    color: #111;
}

body {

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;
    font-weight: 400;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 58px;

    background: #fff;

    border-top: 1px solid #111;

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    align-items: center;

    padding: 0 12px;

    z-index: 1000;
}


/* LEFT */

.header-left {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* + / - */

.header-button {

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    color: #111;

    cursor: pointer;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 22px;

    font-weight: 300;

    line-height: 1;

    appearance: none;
}


.header-button.minus {

    color: #cfcfcf;
}


/* CENTER */

.header-center {

    text-align: center;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


/* RIGHT */

.header-right {

    display: flex;

    justify-content: flex-end;

    align-items: center;
}


.info-button {

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    color: #111;

    cursor: pointer;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    appearance: none;
}


/* =========================================================
   MENU PANEL
========================================================= */

.menu-panel {

    position: fixed;

    top: 58px;
    left: 0;

    width: 100%;

    background: #fff;

    border-bottom: 1px solid #111;

    z-index: 900;

    display: none;

    padding:
        22px
        30px
        35px;
}


.menu-panel.open {

    display: block;
}


/* =========================================================
   CATEGORY MENU
========================================================= */

.category-menu {

    display: flex;

    align-items: flex-start;

    gap: 42px;

    margin-bottom: 35px;
}


.category-button {

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    color: #111;

    cursor: pointer;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    appearance: none;
}


.category-button.active {

    text-decoration: underline;
}


/* =========================================================
   PROJECT LIST
========================================================= */

.project-list {

    display: none;

    flex-direction: column;

    gap: 9px;

    max-height: 65vh;

    overflow-y: auto;

    width: 100%;
}


.project-list.visible {

    display: flex;
}


.project-button {

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    color: #111;

    cursor: pointer;

    text-align: left;

    width: fit-content;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    line-height: 1.3;

    appearance: none;
}


.project-button:hover {

    text-decoration: underline;
}


/* =========================================================
   INFO PANEL
========================================================= */

.info-panel {

    position: fixed;

    top: 58px;
    right: 0;

    width: 430px;

    max-width: 100%;

    background: #fff;

    border-left: 1px solid #111;

    border-bottom: 1px solid #111;

    z-index: 950;

    display: none;

    padding:
        35px
        60px
        45px;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    line-height: 1.6;
}


.info-panel.open {

    display: block;
}


.info-name {

    margin-bottom: 25px;

    font-size: 11px;

    font-weight: 400;
}


.info-panel a {

    color: #111;

    text-decoration: none;
}


.info-panel a:hover {

    text-decoration: underline;
}


/* =========================================================
   HOME
========================================================= */

.home {

    padding-top: 58px;

    width: 100%;
}


/* =========================================================
   HERO
========================================================= */

.hero {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    width: 100%;

    gap: 0;
}


.hero-card {

    width: 100%;

    cursor: pointer;
}


.hero-image {

    display: block;

    width: 100%;

    height:
        calc(100vh - 58px);

    min-height: 500px;

    object-fit: cover;
}


.hero-caption {

    padding:
        6px
        5px
        18px;

    font-size: 11px;

    line-height: 1.3;
}


/* EMPTY */

.empty-image {

    width: 100%;

    height:
        calc(100vh - 58px);

    min-height: 500px;

    background: #eee;
}


/* =========================================================
   WORK VIEW
========================================================= */

.work-view {

    position: fixed;

    top: 58px;
    left: 0;

    width: 100%;

    height:
        calc(100vh - 58px);

    background: #fff;

    z-index: 800;

    display: none;

    overflow-y: auto;

    padding:
        45px
        30px
        80px;
}


.work-view.open {

    display: block;
}


.work-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 40px;
}


.work-name {

    font-size: 11px;

    font-weight: 400;
}


.work-close {

    border: none;

    background: transparent;

    padding: 0;

    cursor: pointer;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    color: #111;

    appearance: none;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 25px;
}


.gallery img {

    display: block;

    width: auto;

    max-width: 100%;

    height: auto;

    object-fit: contain;
}


/* =========================================================
   NO PROJECT
========================================================= */

.no-project {

    color: #999;

    font-size: 11px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {


    .header {

        height: 55px;
    }


    .home {

        padding-top: 55px;
    }


    .menu-panel {

        top: 55px;

        padding:
            20px
            20px
            25px;
    }


    .category-menu {

        gap: 22px;

        flex-wrap: wrap;
    }


    .info-panel {

        top: 55px;

        width: 100%;

        border-left: none;

        padding:
            30px
            25px
            40px;
    }


    .hero {

        grid-template-columns: 1fr;
    }


    .hero-card:not(:first-child) {

        display: none;
    }


    .hero-image {

        height:
            calc(100vh - 55px);
    }


    .empty-image {

        height:
            calc(100vh - 55px);
    }


    .work-view {

        top: 55px;

        height:
            calc(100vh - 55px);

        padding:
            30px
            15px
            60px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">


    <div class="header-left">

        <button
            class="header-button"
            id="openMenu"
        >
            +
        </button>


        <button
            class="header-button minus"
            id="closeMenu"
        >
            −
        </button>

    </div>


    <div class="header-center">

        SONGNANSAE

    </div>


    <div class="header-right">

        <button
            class="info-button"
            id="infoButton"
        >
            Info
        </button>

    </div>

</header>



<!-- =========================================================
     MENU
========================================================= -->

<nav
    class="menu-panel"
    id="menuPanel"
>


    <div class="category-menu">


        <button
            class="category-button"
            data-category="commercial"
        >
            Commercial
        </button>


        <button
            class="category-button"
            data-category="magazine"
        >
            Magazine
        </button>


        <button
            class="category-button"
            data-category="personal"
        >
            Personal
        </button>


        <button
            class="category-button"
            data-category="film"
        >
            Film
        </button>


    </div>


    <div
        class="project-list"
        id="projectList"
    ></div>


</nav>



<!-- =========================================================
     INFO
========================================================= -->

<section
    class="info-panel"
    id="infoPanel"
>


    <div class="info-name">

        SONGNANSAE

    </div>


    Commercial Photographer<br>

    Seoul, Korea<br><br>


    For commissions and inquiries<br>


    <a href="mailto:songnansae@gmail.com">

        songnansae@gmail.com

    </a>


    <br><br>


    <a
        href="https://www.instagram.com/songnansae"
        target="_blank"
        rel="noopener"
    >

        Instagram

    </a>


</section>



<!-- =========================================================
     HOME
========================================================= -->

<main
    class="home"
    id="home"
>


    <section
        class="hero"
        id="hero"
    ></section>


</main>



<!-- =========================================================
     WORK VIEW
========================================================= -->

<section
    class="work-view"
    id="workView"
>


    <div class="work-header">


        <div
            class="work-name"
            id="workName"
        ></div>


        <button
            class="work-close"
            id="workClose"
        >

            Close

        </button>


    </div>


    <div
        class="gallery"
        id="gallery"
    ></div>


</section>



<script>

/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "songnansae";

const GITHUB_REPO = "SONGNANSAE";

const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";


/* =========================================================
   CATEGORIES
========================================================= */

const CATEGORIES = [

    "commercial",
    "magazine",
    "personal",
    "film"

];


/* =========================================================
   DATA
========================================================= */

let siteData = {

    commercial: [],
    magazine: [],
    personal: [],
    film: []

};


/* =========================================================
   DOM
========================================================= */

const menuPanel =
    document.getElementById(
        "menuPanel"
    );


const infoPanel =
    document.getElementById(
        "infoPanel"
    );


const hero =
    document.getElementById(
        "hero"
    );


const projectList =
    document.getElementById(
        "projectList"
    );


const workView =
    document.getElementById(
        "workView"
    );


const workName =
    document.getElementById(
        "workName"
    );


const gallery =
    document.getElementById(
        "gallery"
    );


/* =========================================================
   GITHUB API
========================================================= */

async function githubAPI(path) {


    const url =

        "https://api.github.com/repos/" +

        GITHUB_OWNER +

        "/" +

        GITHUB_REPO +

        "/contents/" +

        path +

        "?ref=" +

        GITHUB_BRANCH;


    const response =

        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "GitHub API Error"
        );

    }


    return await response.json();

}


/* =========================================================
   IMAGE URL
========================================================= */

function imageURL(path) {


    return (

        "https://raw.githubusercontent.com/" +

        GITHUB_OWNER +

        "/" +

        GITHUB_REPO +

        "/" +

        GITHUB_BRANCH +

        "/" +

        path

    );

}


/* =========================================================
   GET PROJECT FOLDERS
========================================================= */

async function getProjects(category) {


    try {


        const items =

            await githubAPI(

                IMAGE_ROOT +

                "/" +

                category

            );


        if (!Array.isArray(items)) {

            return [];

        }


        return items

            .filter(

                item =>

                    item.type === "dir"

            )

            .sort(

                (a, b) =>

                    a.name.localeCompare(

                        b.name,

                        undefined,

                        {
                            numeric: true,
                            sensitivity: "base"
                        }

                    )

            );


    } catch (error) {


        console.log(

            "Could not load:",

            category

        );


        return [];

    }

}


/* =========================================================
   GET PROJECT IMAGES
========================================================= */

async function getProjectImages(path) {


    try {


        const items =

            await githubAPI(path);


        if (!Array.isArray(items)) {

            return [];

        }


        return items

            .filter(

                item =>

                    item.type === "file" &&

                    /\.(jpg|jpeg|png|webp|gif)$/i
                        .test(item.name)

            )

            .sort(

                (a, b) =>

                    a.name.localeCompare(

                        b.name,

                        undefined,

                        {

                            numeric: true,

                            sensitivity: "base"

                        }

                    )

            );


    } catch (error) {


        return [];

    }

}


/* =========================================================
   LOAD ALL DATA
========================================================= */

async function loadSiteData() {


    for (

        const category

        of CATEGORIES

    ) {


        const projects =

            await getProjects(
                category
            );


        siteData[category] = [];


        for (

            const project

            of projects

        ) {


            const images =

                await getProjectImages(

                    project.path

                );


            siteData[category].push({

                name:
                    project.name,

                path:
                    project.path,

                images:
                    images

            });

        }

    }

}


/* =========================================================
   HOME HERO
========================================================= */

function renderHome() {


    hero.innerHTML = "";


    const homeCategories = [

        "commercial",
        "magazine",
        "personal"

    ];


    homeCategories.forEach(

        category => {


            const card =

                document.createElement(
                    "article"
                );


            card.className =
                "hero-card";


            const projects =

                siteData[category] || [];


            /*
             * 첫 번째 작업을
             * 메인 대표 작업으로 사용
             */

            const project =

                projects.length > 0

                    ? projects[0]

                    : null;


            if (

                project &&

                project.images.length > 0

            ) {


                const img =

                    document.createElement(
                        "img"
                    );


                img.className =
                    "hero-image";


                img.src =

                    imageURL(

                        project.images[0].path

                    );


                img.alt =
                    project.name;


                const caption =

                    document.createElement(
                        "div"
                    );


                caption.className =
                    "hero-caption";


                caption.textContent =

                    capitalize(category) +

                    ", " +

                    project.name;


                card.appendChild(
                    img
                );


                card.appendChild(
                    caption
                );


                card.addEventListener(

                    "click",

                    () => {

                        openProject(

                            category,

                            project.name

                        );

                    }

                );

            }


            else {


                const empty =

                    document.createElement(
                        "div"
                    );


                empty.className =
                    "empty-image";


                const caption =

                    document.createElement(
                        "div"
                    );


                caption.className =
                    "hero-caption";


                caption.textContent =

                    capitalize(category);


                card.appendChild(
                    empty
                );


                card.appendChild(
                    caption
                );

            }


            hero.appendChild(
                card
            );

        }

    );

}


/* =========================================================
   SHOW CATEGORY PROJECTS
========================================================= */

function showCategory(category) {


    /*
     * 기존 활성 상태 제거
     */

    document
        .querySelectorAll(
            ".category-button"
        )
        .forEach(

            button => {

                button.classList.remove(
                    "active"
                );

            }

        );


    /*
     * 현재 버튼 활성화
     */

    const currentButton =

        document.querySelector(

            `.category-button[data-category="${category}"]`

        );


    if (currentButton) {

        currentButton.classList.add(
            "active"
        );

    }


    /*
     * 프로젝트 목록 초기화
     */

    projectList.innerHTML =
        "";


    const projects =

        siteData[category] || [];


    projectList.classList.add(
        "visible"
    );


    if (projects.length === 0) {


        const empty =

            document.createElement(
                "div"
            );


        empty.className =
            "no-project";


        empty.textContent =
            "No projects yet.";


        projectList.appendChild(
            empty
        );


        return;

    }


    /*
     * 프로젝트 목록 출력
     */

    projects.forEach(

        project => {


            const button =

                document.createElement(
                    "button"
                );


            button.className =
                "project-button";


            button.textContent =
                project.name;


            button.addEventListener(

                "click",

                () => {

                    openProject(

                        category,

                        project.name

                    );

                }

            );


            projectList.appendChild(
                button
            );

        }

    );

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(

    category,

    projectName

) {


    const project =

        siteData[category].find(

            item =>

                item.name === projectName

        );


    if (!project) {

        return;

    }


    workName.textContent =
        project.name;


    gallery.innerHTML =
        "";


    /*
     * 메뉴 닫기
     */

    menuPanel.classList.remove(
        "open"
    );


    infoPanel.classList.remove(
        "open"
    );


    /*
     * 사진 출력
     */

    if (

        project.images.length === 0

    ) {


        const empty =

            document.createElement(
                "div"
            );


        empty.className =
            "no-project";


        empty.textContent =
            "No images yet.";


        gallery.appendChild(
            empty
        );

    }


    else {


        project.images.forEach(

            image => {


                const img =

                    document.createElement(
                        "img"
                    );


                img.src =

                    imageURL(
                        image.path
                    );


                img.alt =
                    project.name;


                gallery.appendChild(
                    img
                );

            }

        );

    }


    /*
     * 프로젝트 화면 열기
     */

    workView.classList.add(
        "open"
    );


    window.scrollTo(
        0,
        0
    );

}


/* =========================================================
   CLOSE PROJECT
========================================================= */

document
    .getElementById(
        "workClose"
    )
    .addEventListener(

        "click",

        () => {

            workView.classList.remove(
                "open"
            );

        }

    );


/* =========================================================
   OPEN MENU
========================================================= */

document
    .getElementById(
        "openMenu"
    )
    .addEventListener(

        "click",

        () => {


            /*
             * Info가 열려 있으면 닫기
             */

            infoPanel.classList.remove(
                "open"
            );


            menuPanel.classList.toggle(
                "open"
            );

        }

    );


/* =========================================================
   CLOSE MENU
========================================================= */

document
    .getElementById(
        "closeMenu"
    )
    .addEventListener(

        "click",

        () => {

            menuPanel.classList.remove(
                "open"
            );


            projectList.classList.remove(
                "visible"
            );


            document
                .querySelectorAll(
                    ".category-button"
                )
                .forEach(

                    button => {

                        button.classList.remove(
                            "active"
                        );

                    }

                );

        }

    );


/* =========================================================
   INFO
========================================================= */

document
    .getElementById(
        "infoButton"
    )
    .addEventListener(

        "click",

        () => {


            /*
             * 메뉴가 열려 있으면 닫기
             */

            menuPanel.classList.remove(
                "open"
            );


            infoPanel.classList.toggle(
                "open"
            );

        }

    );


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".category-button"
    )
    .forEach(

        button => {


            button.addEventListener(

                "click",

                () => {


                    const category =

                        button.dataset.category;


                    showCategory(
                        category
                    );

                }

            );

        }

    );


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text) {


    if (!text) {

        return "";

    }


    return (

        text.charAt(0).toUpperCase() +

        text.slice(1)

    );

}


/* =========================================================
   START
========================================================= */

(async function () {


    try {


        await loadSiteData();


        renderHome();


    } catch (error) {


        console.error(
            error
        );


        renderHome();

    }


})();

</script>


</body>

</html>
