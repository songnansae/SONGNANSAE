<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #111;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
}

body {
  overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 52px;

  z-index: 1000;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 0 14px;

  background: #fff;
}

.menu-button,
.info-button {
  border: 0;
  background: none;

  padding: 0;
  margin: 0;

  font-family: inherit;
  font-size: 13px;

  color: #111;

  cursor: pointer;
}

.menu-button {
  justify-self: start;
}

.info-button {
  justify-self: end;
}

.logo {
  justify-self: center;

  color: #111;
  text-decoration: none;

  font-size: 13px;

  cursor: pointer;
}


/* =========================
   INFO
========================= */

.info-panel {
  display: none;

  position: fixed;

  top: 52px;
  right: 14px;

  z-index: 900;

  background: #fff;

  font-size: 13px;
  line-height: 1.4;
}

.info-panel.show {
  display: block;
}

.info-panel a {
  color: #111;
  text-decoration: none;
}


/* =========================
   MENU
========================= */

.menu-panel {
  display: none;

  position: fixed;

  top: 52px;
  left: 14px;

  z-index: 900;

  background: #fff;

  width: 340px;
}

.menu-panel.show {
  display: block;
}

.menu-tabs {
  display: flex;
  gap: 18px;

  margin-bottom: 20px;
}

.menu-tab {
  border: 0;
  background: none;

  padding: 0;
  margin: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.menu-tab.active {
  text-decoration: underline;
}

.project-list {
  display: flex;
  flex-direction: column;

  gap: 6px;
}

.project-item {
  width: fit-content;

  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  color: #111;

  cursor: pointer;

  text-align: left;
}

.project-item:hover {
  text-decoration: underline;
}


/* =========================
   MAIN
========================= */

main {
  padding-top: 52px;
}


/* =========================
   HOME
========================= */

.home {
  width: 100%;
  height: calc(100vh - 52px);

  display: flex;
  align-items: center;
  justify-content: center;
}

.home-image-wrap {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.home-image {
  display: block;

  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
}


/* =========================
   DETAIL
========================= */

.detail {
  display: none;

  padding: 78px 14px 50px;
}

.detail.show {
  display: block;
}

.detail-header {
  display: flex;

  justify-content: space-between;
  align-items: baseline;

  margin-bottom: 24px;
}

.detail-category,
.detail-title {
  font-size: 13px;
}


/* =========================
   DETAIL IMAGES

   한 줄에 한 장
   전체 사진 표시
   크롭 없음
========================= */

.detail-grid {
  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;

  gap: 30px;
}

.detail-image {
  display: block;

  width: auto;
  height: auto;

  max-width: 100%;
  max-height: calc(100vh - 150px);

  object-fit: contain;

  margin: 0 auto;
}


/* =========================
   BACK
========================= */

.back-button {
  border: 0;
  background: none;

  padding: 0;
  margin-top: 40px;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.back-button:hover {
  text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: 48px;

    padding: 0 12px;
  }

  main {
    padding-top: 48px;
  }

  .menu-panel {
    top: 48px;
    left: 12px;

    width: calc(100% - 24px);
  }

  .info-panel {
    top: 48px;
    right: 12px;
  }

  .home {
    height: calc(100vh - 48px);
  }

  .detail {
    padding: 68px 10px 40px;
  }

  .detail-grid {
    gap: 20px;
  }

  .detail-image {
    max-width: 100%;
    max-height: calc(100vh - 120px);
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <button
    id="menuButton"
    class="menu-button"
    type="button"
  >+</button>


  <a
    id="logo"
    class="logo"
    href="#"
  >SONGNANSAE</a>


  <button
    id="infoButton"
    class="info-button"
    type="button"
  >Info</button>

</header>


<!-- =========================
     INFO
========================= -->

<div
  id="infoPanel"
  class="info-panel"
>

  <div>Commercial Photographer</div>

  <div>Seoul, Korea</div>

  <br>

  <div>For commissions and inquiries</div>

  <div>
    <a href="mailto:songnansae@gmail.com">
      songnansae@gmail.com
    </a>
  </div>

  <div>
    <a
      href="https://www.instagram.com/songnansae/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  </div>

</div>


<!-- =========================
     MENU
========================= -->

<div
  id="menuPanel"
  class="menu-panel"
>

  <div class="menu-tabs">

    <button
      class="menu-tab active"
      data-category="commercial"
      type="button"
    >
      Commercial
    </button>

    <button
      class="menu-tab"
      data-category="magazine"
      type="button"
    >
      Magazine
    </button>

    <button
      class="menu-tab"
      data-category="personal"
      type="button"
    >
      Personal
    </button>

    <button
      class="menu-tab"
      data-category="film"
      type="button"
    >
      Film
    </button>

  </div>


  <div
    id="projectList"
    class="project-list"
  ></div>

</div>


<!-- =========================
     MAIN
========================= -->

<main>


  <!-- HOME -->

  <section
    id="home"
    class="home"
  >

    <div
      id="homeImageWrap"
      class="home-image-wrap"
    >

      <img
        id="homeImage"
        class="home-image"
        src=""
        alt=""
      >

    </div>

  </section>


  <!-- DETAIL -->

  <section
    id="detail"
    class="detail"
  >

    <div class="detail-header">

      <div
        id="detailCategory"
        class="detail-category"
      ></div>

      <div
        id="detailTitle"
        class="detail-title"
      ></div>

    </div>


    <div
      id="detailGrid"
      class="detail-grid"
    ></div>


    <button
      id="backButton"
      class="back-button"
      type="button"
    >
      Back
    </button>

  </section>

</main>


<script>

/* =========================================================
   GITHUB
========================================================= */

const GITHUB_OWNER = "songnansae";

const GITHUB_REPO = "SONGNANSAE";

const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";


/* =========================================================
   ELEMENTS
========================================================= */

const menuButton =
  document.getElementById("menuButton");

const logo =
  document.getElementById("logo");

const infoButton =
  document.getElementById("infoButton");

const menuPanel =
  document.getElementById("menuPanel");

const infoPanel =
  document.getElementById("infoPanel");

const projectList =
  document.getElementById("projectList");

const home =
  document.getElementById("home");

const homeImage =
  document.getElementById("homeImage");

const homeImageWrap =
  document.getElementById("homeImageWrap");

const detail =
  document.getElementById("detail");

const detailCategory =
  document.getElementById("detailCategory");

const detailTitle =
  document.getElementById("detailTitle");

const detailGrid =
  document.getElementById("detailGrid");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   STATE
========================================================= */

let currentCategory = "commercial";

let projects = {
  commercial: [],
  magazine: [],
  personal: [],
  film: []
};

let homeImages = [];

let currentHomeIndex = 0;


/* =========================================================
   SORT
========================================================= */

function naturalSort(a, b) {

  return a.localeCompare(
    b,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );

}


/* =========================================================
   GITHUB PATH
========================================================= */

function encodePath(path) {

  return path
    .split("/")
    .map(
      part => encodeURIComponent(part)
    )
    .join("/");

}


/* =========================================================
   GITHUB API
========================================================= */

async function github(path) {

  const url =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/contents/" +
    encodePath(path) +
    "?ref=" +
    GITHUB_BRANCH;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "GitHub API " +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   IMAGE FILE
========================================================= */

function isImage(item) {

  return (
    item.type === "file" &&
    /\.(jpg|jpeg|png|webp|gif|avif)$/i
      .test(item.name)
  );

}


/* =========================================================
   HOME
========================================================= */

async function loadHome() {

  try {

    const files =
      await github(
        "images/home"
      );


    homeImages =
      files
        .filter(isImage)
        .sort(
          (a, b) =>
            naturalSort(
              a.name,
              b.name
            )
        );


    if (
      homeImages.length === 0
    ) {

      console.log(
        "images/home 폴더에 이미지가 없습니다."
      );

      return;

    }


    currentHomeIndex = 0;

    showHome();

  }

  catch (error) {

    console.error(
      "HOME ERROR",
      error
    );

  }

}


/* =========================================================
   SHOW HOME
========================================================= */

function showHome() {

  if (
    homeImages.length === 0
  ) {
    return;
  }


  const image =
    homeImages[
      currentHomeIndex
    ];


  homeImage.src =
    image.download_url;

  homeImage.alt =
    image.name;

}


/* =========================================================
   NEXT HOME
========================================================= */

function nextHome() {

  if (
    homeImages.length <= 1
  ) {
    return;
  }


  currentHomeIndex =
    (
      currentHomeIndex + 1
    ) %
    homeImages.length;


  showHome();

}


homeImageWrap.addEventListener(
  "click",
  nextHome
);


/* =========================================================
   LOAD CATEGORY
========================================================= */

async function loadCategory(
  category
) {

  try {

    const folders =
      await github(
        "images/" + category
      );


    const folderList =
      folders
        .filter(
          item =>
            item.type === "dir"
        )
        .sort(
          (a, b) =>
            naturalSort(
              a.name,
              b.name
            )
        );


    const result = [];


    for (
      const folder of folderList
    ) {

      try {

        const files =
          await github(
            folder.path
          );


        const images =
          files
            .filter(isImage)
            .sort(
              (a, b) =>
                naturalSort(
                  a.name,
                  b.name
                )
            );


        if (
          images.length > 0
        ) {

          result.push({

            name: folder.name,

            images: images

          });

        }

      }

      catch (error) {

        console.error(
          folder.name,
          error
        );

      }

    }


    projects[category] =
      result;


    renderProjects(
      category
    );

  }

  catch (error) {

    console.error(
      "CATEGORY ERROR",
      category,
      error
    );

    projectList.innerHTML =
      "";

  }

}


/* =========================================================
   PROJECT LIST
========================================================= */

function renderProjects(
  category
) {

  projectList.innerHTML =
    "";


  projects[category].forEach(
    (
      project,
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "project-item";


      button.textContent =
        project.name;


      button.onclick =
        function() {

          openProject(
            category,
            index
          );

        };


      projectList.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(
  category,
  index
) {

  const project =
    projects[category][index];


  if (!project) {
    return;
  }


  home.style.display =
    "none";


  detail.classList.add(
    "show"
  );


  menuPanel.classList.remove(
    "show"
  );


  menuButton.textContent =
    "+";


  detailCategory.textContent =
    category.charAt(0).toUpperCase() +
    category.slice(1);


  detailTitle.textContent =
    project.name;


  detailGrid.innerHTML =
    "";


  project.images.forEach(
    image => {

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "detail-image";


      img.src =
        image.download_url;


      img.alt =
        image.name;


      img.loading =
        "lazy";


      detailGrid.appendChild(
        img
      );

    }
  );


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   MENU OPEN / CLOSE
========================================================= */

menuButton.onclick =
  async function() {

    if (
      menuPanel.classList.contains(
        "show"
      )
    ) {

      menuPanel.classList.remove(
        "show"
      );

      menuButton.textContent =
        "+";

      return;

    }


    menuPanel.classList.add(
      "show"
    );


    infoPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "−";


    if (
      projects[currentCategory].length === 0
    ) {

      await loadCategory(
        currentCategory
      );

    }

    else {

      renderProjects(
        currentCategory
      );

    }

  };


/* =========================================================
   INFO
========================================================= */

infoButton.onclick =
  function() {

    const open =
      infoPanel.classList.contains(
        "show"
      );


    if (open) {

      infoPanel.classList.remove(
        "show"
      );

    }

    else {

      infoPanel.classList.add(
        "show"
      );

      menuPanel.classList.remove(
        "show"
      );

      menuButton.textContent =
        "+";

    }

  };


/* =========================================================
   CATEGORY TABS
========================================================= */

document
  .querySelectorAll(
    ".menu-tab"
  )
  .forEach(
    tab => {

      tab.onclick =
        async function() {

          const category =
            tab.dataset.category;


          currentCategory =
            category;


          document
            .querySelectorAll(
              ".menu-tab"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          tab.classList.add(
            "active"
          );


          if (
            projects[category].length === 0
          ) {

            await loadCategory(
              category
            );

          }

          else {

            renderProjects(
              category
            );

          }

        };

    }
  );


/* =========================================================
   LOGO → HOME
========================================================= */

logo.onclick =
  function(event) {

    event.preventDefault();


    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    menuPanel.classList.remove(
      "show"
    );


    infoPanel.classList.remove(
      "show"
    );


    menuButton.textContent =
      "+";


    window.scrollTo(
      0,
      0
    );

  };


/* =========================================================
   BACK
========================================================= */

backButton.onclick =
  function() {

    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    window.scrollTo(
      0,
      0
    );

  };


/* =========================================================
   START
========================================================= */

loadHome();

</script>

</body>
</html>
