<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SONGNANSAE</title>


<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;
}

body {

    background: #fff;

    color: #111;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 92px;

    background: #fff;

    border-top: 1px solid #111;

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    align-items: center;

    padding: 0 12px;

    z-index: 1000;
}


/* =========================================================
   LEFT + / -
========================================================= */

.header-left {

    display: flex;

    align-items: center;

    gap: 14px;
}


.header-button {

    border: 0;

    background: none;

    padding: 0;

    margin: 0;

    cursor: pointer;

    color: #111;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 22px;

    font-weight: 400;

    line-height: 1;
}


.header-button.minus {

    color: #cfcfcf;
}


/* =========================================================
   CENTER LOGO
========================================================= */

.header-center {

    text-align: center;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


/* =========================================================
   RIGHT
========================================================= */

.header-right {

    display: flex;

    justify-content: flex-end;

    align-items: center;

}


/* INFO BUTTON */

.info-button {

    border: 0;

    background: none;

    padding: 0;

    margin: 0;

    cursor: pointer;

    color: #111;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


/* =========================================================
   MENU
========================================================= */

.menu {

    position: fixed;

    top: 92px;
    left: 0;

    width: 100%;

    background: #fff;

    border-bottom: 1px solid #111;

    z-index: 900;

    display: none;

    padding:
        0
        30px
        35px;
}


.menu.open {

    display: block;
}


.menu-list {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 42px;
}


.menu-item {

    border: 0;

    background: none;

    padding: 0;

    margin: 0;

    cursor: pointer;

    color: #111;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    line-height: 1.2;
}


.menu-item:hover {

    text-decoration: underline;
}


/* =========================================================
   INFO PANEL
========================================================= */

.info-panel {

    position: fixed;

    top: 92px;
    right: 0;

    width: 420px;

    background: #fff;

    border-left: 1px solid #111;

    border-bottom: 1px solid #111;

    z-index: 950;

    padding: 30px;

    display: none;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    line-height: 1.6;
}


.info-panel.open {

    display: block;
}


.info-name {

    font-size: 11px;

    font-weight: 400;

    margin-bottom: 25px;
}


.info-panel a {

    color: inherit;

    text-decoration: none;
}


.info-panel a:hover {

    text-decoration: underline;
}


/* =========================================================
   HOME
========================================================= */

.home {

    padding-top: 92px;
}


/* =========================================================
   MAIN 3 IMAGES
========================================================= */

.hero {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr)
        );

    gap: 0;
}


.hero-card {

    width: 100%;

    min-width: 0;

    cursor: pointer;
}


/* MAIN IMAGE */

.hero-image {

    display: block;

    width: 100%;

    height:
        calc(
            100vh - 92px
        );

    min-height: 500px;

    object-fit: cover;
}


/* IMAGE CAPTION */

.hero-caption {

    padding:
        7px
        5px
        18px;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    line-height: 1.4;
}


/* EMPTY IMAGE */

.empty-hero {

    width: 100%;

    height:
        calc(
            100vh - 92px
        );

    min-height: 500px;

    background: #f2f2f2;
}


/* =========================================================
   CATEGORY PAGE
========================================================= */

.category-page {

    display: none;

    padding-top: 120px;

    padding-left: 15px;
    padding-right: 15px;

    padding-bottom: 80px;
}


.category-page.active {

    display: block;
}


.page-back {

    border: 0;

    background: none;

    padding: 0;

    margin:
        0
        0
        35px;

    cursor: pointer;

    color: #111;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


.category-title {

    margin:
        0
        0
        35px;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


.work-list {

    display: flex;

    flex-direction: column;

    gap: 10px;

    max-width: 800px;
}


.work-button {

    border: 0;

    background: none;

    padding: 0;

    margin: 0;

    width: fit-content;

    text-align: left;

    cursor: pointer;

    color: #111;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


.work-button:hover {

    text-decoration: underline;
}


/* =========================================================
   WORK PAGE
========================================================= */

.work-page {

    display: none;

    padding-top: 120px;

    padding-left: 15px;
    padding-right: 15px;

    padding-bottom: 80px;
}


.work-page.active {

    display: block;
}


.work-title {

    margin:
        0
        0
        35px;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 400;
}


.gallery {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}


.gallery img {

    display: block;

    width: 100%;

    height: auto;

    object-fit: contain;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {


    .header {

        height: 62px;

        padding:
            0
            10px;
    }


    .home {

        padding-top: 62px;
    }


    .menu {

        top: 62px;

        padding:
            0
            20px
            25px;
    }


    .menu-list {

        gap: 22px;
    }


    .menu-item {

        font-size: 11px;
    }


    .info-panel {

        top: 62px;

        width: 100%;

        border-left: 0;
    }


    .hero {

        grid-template-columns: 1fr;
    }


    .hero-card:not(:first-child) {

        display: none;
    }


    .hero-image {

        height:
            calc(
                100vh - 62px
            );

        min-height: 450px;
    }


    .empty-hero {

        height:
            calc(
                100vh - 62px
            );

        min-height: 450px;
    }


    .category-page,
    .work-page {

        padding-top: 90px;

        padding-left: 12px;
        padding-right: 12px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">


    <!-- LEFT -->

    <div class="header-left">

        <button
            class="header-button"
            id="openMenu"
            aria-label="Open menu"
        >
            +
        </button>


        <button
            class="header-button minus"
            id="closeMenu"
            aria-label="Close menu"
        >
            −
        </button>

    </div>


    <!-- CENTER -->

    <div class="header-center">

        SONGNANSAE

    </div>


    <!-- RIGHT -->

    <div class="header-right">

        <button
            class="info-button"
            id="infoButton"
        >
            Info
        </button>

    </div>

</header>



<!-- =========================================================
     MENU
========================================================= -->

<nav
    class="menu"
    id="menu"
>

    <div class="menu-list">


        <button
            class="menu-item"
            data-category="commercial"
        >
            Commercial
        </button>


        <button
            class="menu-item"
            data-category="magazine"
        >
            Magazine
        </button>


        <button
            class="menu-item"
            data-category="personal"
        >
            Personal
        </button>


        <button
            class="menu-item"
            data-category="film"
        >
            Film
        </button>


    </div>

</nav>



<!-- =========================================================
     INFO
========================================================= -->

<section
    class="info-panel"
    id="infoPanel"
>


    <div class="info-name">

        SONGNANSAE

    </div>


    Commercial Photographer<br>

    Seoul, Korea<br><br>


    For commissions and inquiries<br>


    <a href="mailto:songnansae@gmail.com">

        songnansae@gmail.com

    </a>


    <br><br>


    <a
        href="https://www.instagram.com/songnansae"
        target="_blank"
        rel="noopener"
    >

        Instagram

    </a>


</section>



<!-- =========================================================
     HOME
========================================================= -->

<main
    class="home"
    id="home"
>


    <section
        class="hero"
        id="hero"
    >

    </section>


</main>



<!-- =========================================================
     CATEGORY PAGE
========================================================= -->

<section
    class="category-page"
    id="categoryPage"
>


    <button
        class="page-back"
        id="categoryBack"
    >

        ← Back

    </button>


    <h1
        class="category-title"
        id="categoryTitle"
    ></h1>


    <div
        class="work-list"
        id="workList"
    ></div>


</section>



<!-- =========================================================
     WORK PAGE
========================================================= -->

<section
    class="work-page"
    id="workPage"
>


    <button
        class="page-back"
        id="workBack"
    >

        ← Back

    </button>


    <h1
        class="work-title"
        id="workTitle"
    ></h1>


    <div
        class="gallery"
        id="gallery"
    ></div>


</section>



<script>


/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "songnansae";

const GITHUB_REPO = "SONGNANSAE";

const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";


/* =========================================================
   CATEGORIES
========================================================= */

const CATEGORIES = [

    "commercial",

    "magazine",

    "personal",

    "film"

];


/* =========================================================
   SITE DATA
========================================================= */

let siteData = {

    commercial: [],

    magazine: [],

    personal: [],

    film: []

};


/* =========================================================
   CURRENT PAGE
========================================================= */

let currentCategory = "";

let currentWork = "";


/* =========================================================
   DOM
========================================================= */

const menu =
    document.getElementById(
        "menu"
    );


const infoPanel =
    document.getElementById(
        "infoPanel"
    );


const home =
    document.getElementById(
        "home"
    );


const hero =
    document.getElementById(
        "hero"
    );


const categoryPage =
    document.getElementById(
        "categoryPage"
    );


const workPage =
    document.getElementById(
        "workPage"
    );


const categoryTitle =
    document.getElementById(
        "categoryTitle"
    );


const workTitle =
    document.getElementById(
        "workTitle"
    );


const workList =
    document.getElementById(
        "workList"
    );


const gallery =
    document.getElementById(
        "gallery"
    );


/* =========================================================
   GITHUB API
========================================================= */

async function githubAPI(path) {

    const url =

        `https://api.github.com/repos/` +

        `${GITHUB_OWNER}/` +

        `${GITHUB_REPO}/contents/` +

        `${path}?ref=${GITHUB_BRANCH}`;


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "GitHub API Error: " +
            path
        );

    }


    return await response.json();

}


/* =========================================================
   IMAGE URL
========================================================= */

function imageURL(path) {

    return (

        `https://raw.githubusercontent.com/` +

        `${GITHUB_OWNER}/` +

        `${GITHUB_REPO}/` +

        `${GITHUB_BRANCH}/` +

        `${path}`

    );

}


/* =========================================================
   GET WORK FOLDERS
========================================================= */

async function getWorks(category) {

    try {

        const items =

            await githubAPI(

                `${IMAGE_ROOT}/${category}`

            );


        return items

            .filter(

                item =>

                    item.type === "dir"

            )

            .sort(

                (a, b) =>

                    a.name.localeCompare(

                        b.name,

                        undefined,

                        {
                            numeric: true
                        }

                    )

            );

    }


    catch (error) {

        console.log(

            "Category not found:",

            category

        );

        return [];

    }

}


/* =========================================================
   GET IMAGES
========================================================= */

async function getImages(path) {

    try {

        const items =

            await githubAPI(path);


        return items

            .filter(

                item =>

                    item.type === "file" &&

                    /\.(jpg|jpeg|png|webp|gif)$/i
                        .test(item.name)

            )

            .sort(

                (a, b) =>

                    a.name.localeCompare(

                        b.name,

                        undefined,

                        {

                            numeric: true,

                            sensitivity: "base"

                        }

                    )

            );

    }


    catch (error) {

        return [];

    }

}


/* =========================================================
   LOAD SITE
========================================================= */

async function loadSiteData() {


    for (

        const category

        of CATEGORIES

    ) {


        const works =

            await getWorks(
                category
            );


        siteData[category] = [];


        for (

            const work

            of works

        ) {


            const images =

                await getImages(
                    work.path
                );


            siteData[category].push({

                name:
                    work.name,

                path:
                    work.path,

                images:
                    images

            });

        }

    }

}


/* =========================================================
   HOME
========================================================= */

function renderHome() {


    hero.innerHTML = "";


    const mainCategories = [

        "commercial",

        "magazine",

        "personal"

    ];


    mainCategories.forEach(

        category => {


            const works =

                siteData[category] || [];


            const work =

                works.length > 0

                    ? works[0]

                    : null;


            const card =

                document.createElement(
                    "article"
                );


            card.className =
                "hero-card";


            /*
             * PHOTO EXISTS
             */

            if (

                work &&

                work.images &&

                work.images.length > 0

            ) {


                const image =

                    document.createElement(
                        "img"
                    );


                image.className =
                    "hero-image";


                image.src =

                    imageURL(

                        work.images[0].path

                    );


                image.alt =
                    work.name;


                const caption =

                    document.createElement(
                        "div"
                    );


                caption.className =
                    "hero-caption";


                caption.textContent =

                    `${capitalize(category)}, ` +

                    `${work.name}`;


                card.appendChild(
                    image
                );


                card.appendChild(
                    caption
                );


                card.addEventListener(

                    "click",

                    () => {

                        openWork(

                            category,

                            work.name

                        );

                    }

                );

            }


            /*
             * NO PHOTO
             */

            else {


                const empty =

                    document.createElement(
                        "div"
                    );


                empty.className =
                    "empty-hero";


                const caption =

                    document.createElement(
                        "div"
                    );


                caption.className =
                    "hero-caption";


                caption.textContent =
                    capitalize(category);


                card.appendChild(
                    empty
                );


                card.appendChild(
                    caption
                );

            }


            hero.appendChild(
                card
            );

        }

    );

}


/* =========================================================
   OPEN CATEGORY
========================================================= */

function openCategory(category) {


    currentCategory =
        category;


    currentWork = "";


    home.style.display =
        "none";


    workPage.classList.remove(
        "active"
    );


    categoryPage.classList.add(
        "active"
    );


    categoryTitle.textContent =
        capitalize(category);


    workList.innerHTML =
        "";


    const works =
        siteData[category];


    if (

        !works ||

        works.length === 0

    ) {


        workList.innerHTML = `

            <div
                style="
                    color:#999;
                    font-size:11px;
                "
            >
                No projects yet.
            </div>

        `;


        return;

    }


    works.forEach(

        work => {


            const button =

                document.createElement(
                    "button"
                );


            button.className =
                "work-button";


            button.textContent =
                work.name;


            button.addEventListener(

                "click",

                () => {

                    openWork(

                        category,

                        work.name

                    );

                }

            );


            workList.appendChild(
                button
            );

        }

    );

}


/* =========================================================
   OPEN WORK
========================================================= */

function openWork(

    category,

    workName

) {


    currentCategory =
        category;


    currentWork =
        workName;


    home.style.display =
        "none";


    categoryPage.classList.remove(
        "active"
    );


    workPage.classList.add(
        "active"
    );


    workTitle.textContent =
        workName;


    gallery.innerHTML =
        "";


    const work =

        siteData[category].find(

            item =>

                item.name === workName

        );


    if (

        !work ||

        work.images.length === 0

    ) {


        gallery.innerHTML = `

            <div
                style="
                    color:#999;
                    font-size:11px;
                "
            >
                No images.
            </div>

        `;


        return;

    }


    work.images.forEach(

        image => {


            const img =

                document.createElement(
                    "img"
                );


            img.src =

                imageURL(
                    image.path
                );


            img.alt =
                workName;


            gallery.appendChild(
                img
            );

        }

    );

}


/* =========================================================
   HOME
========================================================= */

function goHome() {


    home.style.display =
        "block";


    categoryPage.classList.remove(
        "active"
    );


    workPage.classList.remove(
        "active"
    );

}


/* =========================================================
   OPEN MENU
========================================================= */

document
    .getElementById("openMenu")
    .addEventListener(

        "click",

        () => {

            menu.classList.add(
                "open"
            );

        }

    );


/* =========================================================
   CLOSE MENU
========================================================= */

document
    .getElementById("closeMenu")
    .addEventListener(

        "click",

        () => {

            menu.classList.remove(
                "open"
            );

        }

    );


/* =========================================================
   INFO
========================================================= */

document
    .getElementById("infoButton")
    .addEventListener(

        "click",

        () => {

            infoPanel.classList.toggle(
                "open"
            );

        }

    );


/* =========================================================
   MENU BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".menu-item"
    )
    .forEach(

        button => {


            button.addEventListener(

                "click",

                () => {


                    const category =

                        button.dataset.category;


                    menu.classList.remove(
                        "open"
                    );


                    infoPanel.classList.remove(
                        "open"
                    );


                    openCategory(
                        category
                    );

                }

            );

        }

    );


/* =========================================================
   CATEGORY BACK
========================================================= */

document
    .getElementById("categoryBack")
    .addEventListener(

        "click",

        () => {

            goHome();

        }

    );


/* =========================================================
   WORK BACK
========================================================= */

document
    .getElementById("workBack")
    .addEventListener(

        "click",

        () => {

            openCategory(
                currentCategory
            );

        }

    );


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text) {


    if (!text) {

        return "";

    }


    return (

        text.charAt(0).toUpperCase() +

        text.slice(1)

    );

}


/* =========================================================
   START WEBSITE
========================================================= */

(async function () {


    try {

        await loadSiteData();

        renderHome();

    }


    catch (error) {

        console.error(

            "Could not load website data.",

            error

        );

        renderHome();

    }


})();

</script>


</body>
</html>
