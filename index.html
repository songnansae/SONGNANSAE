<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #fff;
    color: #111;

    font-family:
        Helvetica,
        Arial,
        sans-serif;

    font-size: 13px;
    font-weight: 400;
}


/* =========================
   HEADER
========================= */

.header {
    width: 100%;
    height: 52px;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;

    padding: 0 14px;
}

.header-left {
    justify-self: start;
}

.header-center {
    justify-self: center;
}

.header-right {
    justify-self: end;
}


/* + / - */

.menu-button {
    border: none;
    background: none;

    padding: 0;
    margin: 0;

    font-family: Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1;

    cursor: pointer;
}

.menu-button.minus {
    color: #bbb;
    margin-left: 10px;
}


/* SONGNANSAE */

.logo {
    font-size: 11px;
    font-weight: 400;

    cursor: pointer;
}


/* INFO */

.info-button {
    border: none;
    background: none;

    padding: 0;

    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;

    cursor: pointer;
}


/* =========================
   MENU
========================= */

.menu {
    display: none;

    width: 100%;

    padding: 20px 30px 30px;

    border-bottom: 1px solid #111;
}

.menu.open {
    display: block;
}

.menu-links {
    display: flex;
    gap: 38px;
}

.menu-links button {
    border: none;
    background: none;

    padding: 0;

    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 400;

    cursor: pointer;
}

.menu-links button:hover {
    text-decoration: underline;
}


/* =========================
   MAIN
========================= */

.home {
    width: 100%;
}

.projects {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
}


/* =========================
   PROJECT CARD
========================= */

.project-card {
    width: 100%;

    cursor: pointer;

    overflow: hidden;
}

.project-image-wrap {
    width: 100%;

    aspect-ratio: 3 / 4;

    background: #f1f1f1;

    overflow: hidden;
}

.project-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.project-info {
    width: 100%;

    padding: 7px 4px 10px;

    font-family: Helvetica, Arial, sans-serif;

    font-size: 13px;
    line-height: 1.2;
}


/* =========================
   INFO PAGE
========================= */

.info-page {
    display: none;

    width: 100%;
    min-height: calc(100vh - 52px);

    border-top: 1px solid #111;
}

.info-page.open {
    display: block;
}

.info-inner {
    padding: 60px 8%;

    font-size: 15px;
    line-height: 1.5;
}

.info-inner h1 {
    margin: 0 0 45px;

    font-size: 15px;
    font-weight: 400;
}

.info-inner p {
    margin: 0 0 28px;
}

.info-inner a {
    color: inherit;
    text-decoration: none;
}

.info-inner a:hover {
    text-decoration: underline;
}


/* =========================
   CATEGORY PAGE
========================= */

.category-page {
    display: none;

    width: 100%;
}

.category-page.open {
    display: block;
}

.category-inner {
    padding: 35px 30px 80px;
}

.back {
    border: none;
    background: none;

    padding: 0;
    margin: 0 0 70px;

    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;

    cursor: pointer;
}

.category-title {
    font-size: 15px;
    margin-bottom: 35px;
}

.category-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.category-item {
    border: none;
    background: none;

    padding: 0;

    width: fit-content;

    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;

    cursor: pointer;
}

.category-item:hover {
    text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        height: 48px;
        padding: 0 10px;
    }

    .projects {
        grid-template-columns: 1fr;
    }

    .project-image-wrap {
        aspect-ratio: 3 / 4;
    }

    .menu {
        padding: 20px 20px 25px;
    }

    .menu-links {
        gap: 20px;
        flex-wrap: wrap;
    }

    .menu-links button {
        font-size: 14px;
    }

    .info-inner {
        padding: 45px 30px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-left">

        <button
            class="menu-button"
            id="plusButton">
            +
        </button>

        <button
            class="menu-button minus"
            id="minusButton">
            −
        </button>

    </div>


    <div
        class="header-center logo"
        id="logo">
        SONGNANSAE
    </div>


    <div class="header-right">

        <button
            class="info-button"
            id="infoButton">
            Info
        </button>

    </div>

</header>



<!-- =========================
     MENU
========================= -->

<nav
    class="menu"
    id="menu">

    <div class="menu-links">

        <button data-category="commercial">
            Commercial
        </button>

        <button data-category="magazine">
            Magazine
        </button>

        <button data-category="personal">
            Personal
        </button>

        <button data-category="film">
            Film
        </button>

    </div>

</nav>



<!-- =========================
     HOME
========================= -->

<main
    class="home"
    id="home">

    <div
        class="projects"
        id="projects">

    </div>

</main>



<!-- =========================
     CATEGORY PAGE
========================= -->

<section
    class="category-page"
    id="categoryPage">

    <div class="category-inner">

        <button
            class="back"
            id="backButton">
            ← Back
        </button>

        <div
            class="category-title"
            id="categoryTitle">
        </div>

        <div
            class="category-list"
            id="categoryList">
        </div>

    </div>

</section>



<!-- =========================
     INFO PAGE
========================= -->

<section
    class="info-page"
    id="infoPage">

    <div class="info-inner">

        <h1>SONGNANSAE</h1>

        <p>
            Commercial Photographer<br>
            Seoul, Korea
        </p>

        <p>
            For commissions and inquiries<br>
            <a href="mailto:songnansae@gmail.com">
                songnansae@gmail.com
            </a>
        </p>

        <p>
            <a
                href="https://www.instagram.com/songnansae/"
                target="_blank">
                Instagram
            </a>
        </p>

    </div>

</section>



<script>

/* =====================================================
   PROJECT DATA
=====================================================

   여기만 수정하면 됨.

   각 작업은:

   title  = 사이트에 표시되는 이름
   year   = 연도
   cover  = 메인 화면에서 보여줄 대표사진
   images = 작업 안에서 사용할 사진들

===================================================== */


/* =========================
   COMMERCIAL
========================= */

const commercialProjects = [

    {
        title: "Commercial Project 01",
        year: "2026",

        cover: "images/commercial/Commercial Project 01/01.jpg",

        images: [
            "images/commercial/Commercial Project 01/01.jpg",
            "images/commercial/Commercial Project 01/02.jpg",
            "images/commercial/Commercial Project 01/03.jpg"
        ]
    },

    {
        title: "Commercial Project 02",
        year: "2026",

        cover: "images/commercial/Commercial Project 02/01.jpg",

        images: [
            "images/commercial/Commercial Project 02/01.jpg",
            "images/commercial/Commercial Project 02/02.jpg",
            "images/commercial/Commercial Project 02/03.jpg"
        ]
    }

];



/* =========================
   MAGAZINE
========================= */

const magazineProjects = [

    {
        title: "The Neighbor",
        year: "2026",

        cover: "images/magazine/The Neighbor, 2026/0080_THE NEIGHBOR_260611_R1.JPG",

        images: [
            "images/magazine/The Neighbor, 2026/0080_THE NEIGHBOR_260611_R1.JPG",
            "images/magazine/The Neighbor, 2026/0403_THE NEIGHBOR_260611_R1.JPG",
            "images/magazine/The Neighbor, 2026/0909_THE NEIGHBOR_260611_R1.JPG",
            "images/magazine/The Neighbor, 2026/0948_THE NEIGHBOR_260611_R1.JPG",
            "images/magazine/The Neighbor, 2026/1299_THE NEIGHBOR_260611_R1.jpg",
            "images/magazine/The Neighbor, 2026/1559_THE NEIGHBOR_260611_R1(수정).JPG",
            "images/magazine/The Neighbor, 2026/1771_THE NEIGHBOR_260611_R2(수정).JPG",
            "images/magazine/The Neighbor, 2026/2306_THE NEIGHBOR_260611_R1.JPG"
        ]
    },


    {
        title: "Arena",
        year: "2026",

        cover: "images/magazine/Arena, 2026/01.jpg",

        images: [
            "images/magazine/Arena, 2026/01.jpg",
            "images/magazine/Arena, 2026/02.jpg",
            "images/magazine/Arena, 2026/03.jpg"
        ]
    }

];



/* =========================
   PERSONAL
========================= */

const personalProjects = [

    {
        title: "Personal Project 01",
        year: "2026",

        cover: "images/personal/Personal Project 01/01.jpg",

        images: [
            "images/personal/Personal Project 01/01.jpg",
            "images/personal/Personal Project 01/02.jpg",
            "images/personal/Personal Project 01/03.jpg"
        ]
    },

    {
        title: "Personal Project 02",
        year: "2026",

        cover: "images/personal/Personal Project 02/01.jpg",

        images: [
            "images/personal/Personal Project 02/01.jpg",
            "images/personal/Personal Project 02/02.jpg"
        ]
    }

];



/* =========================
   FILM
========================= */

const filmProjects = [

    {
        title: "Film Project 01",
        year: "2026",

        cover: "images/film/Film Project 01/01.jpg",

        images: [
            "images/film/Film Project 01/01.jpg",
            "images/film/Film Project 01/02.jpg"
        ]
    }

];



/* =====================================================
   ALL CATEGORIES
===================================================== */

const categories = {

    commercial: {
        name: "Commercial",
        projects: commercialProjects
    },

    magazine: {
        name: "Magazine",
        projects: magazineProjects
    },

    personal: {
        name: "Personal",
        projects: personalProjects
    },

    film: {
        name: "Film",
        projects: filmProjects
    }

};



/* =====================================================
   MAIN PAGE
===================================================== */

const projectsContainer =
    document.getElementById("projects");


/*
   현재 메인 화면에서 각각 몇 번째 작업을
   보여주고 있는지 기억함.
*/

const currentIndex = {

    commercial: 0,
    magazine: 0,
    personal: 0

};



/* =====================================================
   MAIN 3개 만들기
===================================================== */

function renderHome() {

    projectsContainer.innerHTML = "";

    const mainCategories = [
        "commercial",
        "magazine",
        "personal"
    ];


    mainCategories.forEach(categoryKey => {

        const category =
            categories[categoryKey];

        const projects =
            category.projects;


        const card =
            document.createElement("div");

        card.className =
            "project-card";


        /*
           프로젝트가 없는 경우
        */

        if (!projects || projects.length === 0) {

            card.innerHTML = `

                <div class="project-image-wrap"></div>

                <div class="project-info">
                    ${category.name}
                </div>

            `;

            projectsContainer.appendChild(card);

            return;
        }


        /*
           현재 순서의 프로젝트
        */

        const index =
            currentIndex[categoryKey] %
            projects.length;

        const project =
            projects[index];


        card.innerHTML = `

            <div class="project-image-wrap">

                <img
                    class="project-image"
                    src="${project.cover}"
                    alt="${project.title}"
                >

            </div>

            <div class="project-info">
                ${category.name}, ${project.title}, ${project.year}
            </div>

        `;


        /*
           메인 사진 클릭
           ↓
           다음 프로젝트
        */

        card.addEventListener(
            "click",
            function () {

                currentIndex[categoryKey]++;

                if (
                    currentIndex[categoryKey]
                    >= projects.length
                ) {

                    currentIndex[categoryKey] = 0;

                }

                renderHome();

            }
        );


        projectsContainer.appendChild(card);

    });

}



/* =====================================================
   MENU
===================================================== */

const menu =
    document.getElementById("menu");

const plusButton =
    document.getElementById("plusButton");

const minusButton =
    document.getElementById("minusButton");


plusButton.addEventListener(
    "click",
    function () {

        menu.classList.add("open");

    }
);


minusButton.addEventListener(
    "click",
    function () {

        menu.classList.remove("open");

    }
);



/* =====================================================
   CATEGORY PAGE
===================================================== */

const home =
    document.getElementById("home");

const categoryPage =
    document.getElementById("categoryPage");

const categoryTitle =
    document.getElementById("categoryTitle");

const categoryList =
    document.getElementById("categoryList");

const backButton =
    document.getElementById("backButton");



function openCategory(categoryKey) {

    const category =
        categories[categoryKey];


    if (!category) {
        return;
    }


    home.style.display = "none";

    menu.classList.remove("open");

    categoryPage.classList.add("open");


    categoryTitle.textContent =
        category.name;


    categoryList.innerHTML = "";


    category.projects.forEach(
        function (project) {

            const button =
                document.createElement("button");

            button.className =
                "category-item";


            button.textContent =
                `${project.title}, ${project.year}`;


            button.addEventListener(
                "click",
                function () {

                    openProject(
                        category,
                        project
                    );

                }
            );


            categoryList.appendChild(button);

        }
    );

}



/* =====================================================
   PROJECT PAGE
===================================================== */

function openProject(category, project) {

    categoryPage.innerHTML = "";


    const wrapper =
        document.createElement("div");

    wrapper.style.padding =
        "35px 30px 80px";


    const back =
        document.createElement("button");

    back.className =
        "back";

    back.textContent =
        "← Back";


    back.addEventListener(
        "click",
        function () {

            categoryPage.innerHTML = "";

            categoryPage.classList.remove(
                "open"
            );

            categoryPage.appendChild(
                createCategoryContent(
                    category
                )
            );

        }
    );


    wrapper.appendChild(back);


    const title =
        document.createElement("div");

    title.style.fontSize =
        "15px";

    title.style.marginBottom =
        "35px";

    title.textContent =
        `${category.name}, ${project.title}, ${project.year}`;


    wrapper.appendChild(title);


    /*
       작업 사진들
    */

    project.images.forEach(
        function (image) {

            const img =
                document.createElement("img");

            img.src =
                image;

            img.alt =
                project.title;

            img.style.width =
                "100%";

            img.style.height =
                "auto";

            img.style.display =
                "block";

            img.style.marginBottom =
                "10px";


            wrapper.appendChild(img);

        }
    );


    categoryPage.appendChild(wrapper);

}



/* =====================================================
   CATEGORY CONTENT
===================================================== */

function createCategoryContent(category) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "category-inner";


    const back =
        document.createElement("button");

    back.className =
        "back";

    back.textContent =
        "← Back";


    back.addEventListener(
        "click",
        function () {

            categoryPage.classList.remove(
                "open"
            );

            home.style.display =
                "block";

            renderHome();

        }
    );


    wrapper.appendChild(back);


    const title =
        document.createElement("div");

    title.className =
        "category-title";

    title.textContent =
        category.name;


    wrapper.appendChild(title);


    const list =
        document.createElement("div");

    list.className =
        "category-list";


    category.projects.forEach(
        function (project) {

            const button =
                document.createElement("button");

            button.className =
                "category-item";

            button.textContent =
                `${project.title}, ${project.year}`;


            button.addEventListener(
                "click",
                function () {

                    openProject(
                        category,
                        project
                    );

                }
            );


            list.appendChild(button);

        }
    );


    wrapper.appendChild(list);


    return wrapper;

}



/* =====================================================
   MENU CATEGORY BUTTONS
===================================================== */

document
    .querySelectorAll(".menu-links button")
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const category =
                        button.dataset.category;

                    openCategory(category);

                }
            );

        }
    );



/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener(
    "click",
    function () {

        categoryPage.classList.remove(
            "open"
        );

        home.style.display =
            "block";

        renderHome();

    }
);



/* =====================================================
   INFO
===================================================== */

const infoButton =
    document.getElementById("infoButton");

const infoPage =
    document.getElementById("infoPage");


infoButton.addEventListener(
    "click",
    function () {

        home.style.display =
            "none";

        categoryPage.classList.remove(
            "open"
        );

        menu.classList.remove(
            "open"
        );

        infoPage.classList.add(
            "open"
        );

    }
);



/* =====================================================
   LOGO → HOME
===================================================== */

const logo =
    document.getElementById("logo");


logo.addEventListener(
    "click",
    function () {

        infoPage.classList.remove(
            "open"
        );

        categoryPage.classList.remove(
            "open"
        );

        home.style.display =
            "block";

        menu.classList.remove(
            "open"
        );

        renderHome();

    }
);



/* =====================================================
   START
===================================================== */

renderHome();

</script>

</body>
</html>
