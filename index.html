<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #111;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
}

body {
  overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 52px;

  z-index: 1000;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 0 14px;

  background: #fff;
}

.menu-button,
.info-button {
  border: 0;
  background: none;

  padding: 0;
  margin: 0;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;
}

.menu-button {
  justify-self: start;
}

.info-button {
  justify-self: end;
}

.logo {
  justify-self: center;

  color: #111;
  text-decoration: none;

  font-size: 13px;
  line-height: 1;
}


/* =========================
   INFO
========================= */

.info-panel {
  display: none;

  position: fixed;

  top: 52px;
  right: 14px;

  z-index: 900;

  width: 260px;

  background: #fff;

  font-size: 13px;
  line-height: 1.4;
}

.info-panel.show {
  display: block;
}

.info-panel a {
  color: #111;
  text-decoration: none;
}

.info-panel a:hover {
  text-decoration: underline;
}


/* =========================
   MENU
========================= */

.menu-panel {
  display: none;

  position: fixed;

  top: 52px;
  left: 14px;

  z-index: 900;

  width: 300px;

  background: #fff;
}

.menu-panel.show {
  display: block;
}

.menu-tabs {
  display: flex;
  gap: 18px;

  margin-bottom: 20px;
}

.menu-tab {
  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.menu-tab.active {
  text-decoration: underline;
}

.project-list {
  display: flex;
  flex-direction: column;

  gap: 5px;
}

.project-item {
  border: 0;
  background: none;

  padding: 0;

  text-align: left;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.project-item:hover {
  text-decoration: underline;
}


/* =========================
   MAIN
========================= */

main {
  padding-top: 52px;
}


/* =========================
   HOME
========================= */

.home {
  width: 100%;
  height: calc(100vh - 52px);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0;
}

.home-image-wrap {
  width: 100%;
  height: calc(100vh - 52px);

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  padding: 0;
}

.home-image {
  display: block;

  width: auto;
  height: auto;

  max-width: 100%;
  max-height: calc(100vh - 52px);

  object-fit: contain;
  object-position: center;

  user-select: none;
  -webkit-user-drag: none;
}


/* =========================
   DETAIL
========================= */

.detail {
  display: none;

  padding: 78px 14px 40px;
}

.detail.show {
  display: block;
}

.detail-header {
  display: flex;

  justify-content: space-between;
  align-items: baseline;

  margin-bottom: 24px;
}

.detail-title,
.detail-category {
  font-size: 13px;
}


/* 한 줄에 한 장 */

.detail-grid {
  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;

  gap: 30px;
}


/*
  사진 전체가 보이도록
  비율 유지
  크롭 없음
*/

.detail-image {
  display: block;

  width: auto;
  height: auto;

  max-width: 100%;
  max-height: calc(100vh - 150px);

  object-fit: contain;

  margin: 0 auto;
}


/* =========================
   BACK
========================= */

.back-button {
  margin-top: 40px;

  border: 0;
  background: none;

  padding: 0;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.back-button:hover {
  text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: 48px;
    padding: 0 12px;
  }

  main {
    padding-top: 48px;
  }

  .info-panel {
    top: 48px;
    right: 12px;
  }

  .menu-panel {
    top: 48px;
    left: 12px;
    width: calc(100% - 24px);
  }

  .home {
    height: calc(100vh - 48px);
  }

  .home-image-wrap {
    height: calc(100vh - 48px);
  }

  .home-image {
    max-height: calc(100vh - 48px);
  }

  .detail {
    padding: 68px 10px 30px;
  }

  .detail-grid {
    gap: 20px;
  }

  .detail-image {
    max-height: calc(100vh - 120px);
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <button
    id="menuButton"
    class="menu-button"
    type="button"
  >+</button>


  <a
    href="#"
    id="logo"
    class="logo"
  >SONGNANSAE</a>


  <button
    id="infoButton"
    class="info-button"
    type="button"
  >Info</button>

</header>


<!-- =========================
     INFO PANEL
========================= -->

<div
  id="infoPanel"
  class="info-panel"
>

  <div>Commercial Photographer</div>
  <div>Seoul, Korea</div>

  <br>

  <div>For commissions and inquiries</div>

  <div>
    <a href="mailto:songnansae@gmail.com">
      songnansae@gmail.com
    </a>
  </div>

  <div>
    <a
      href="https://www.instagram.com/songnansae/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  </div>

</div>


<!-- =========================
     MENU
========================= -->

<div
  id="menuPanel"
  class="menu-panel"
>

  <div
    id="menuTabs"
    class="menu-tabs"
  >

    <button
      class="menu-tab active"
      data-category="commercial"
      type="button"
    >
      Commercial
    </button>


    <button
      class="menu-tab"
      data-category="magazine"
      type="button"
    >
      Magazine
    </button>


    <button
      class="menu-tab"
      data-category="personal"
      type="button"
    >
      Personal
    </button>


    <button
      class="menu-tab"
      data-category="film"
      type="button"
    >
      Film
    </button>

  </div>


  <div
    id="projectList"
    class="project-list"
  ></div>

</div>


<!-- =========================
     MAIN
========================= -->

<main>


  <!-- =====================
       HOME
  ====================== -->

  <section
    id="home"
    class="home"
  >

    <div
      id="homeImageWrap"
      class="home-image-wrap"
    >

      <img
        id="homeImage"
        class="home-image"
        alt=""
      >

    </div>

  </section>


  <!-- =====================
       DETAIL
  ====================== -->

  <section
    id="detail"
    class="detail"
  >

    <div class="detail-header">

      <div
        id="detailCategory"
        class="detail-category"
      ></div>


      <div
        id="detailTitle"
        class="detail-title"
      ></div>

    </div>


    <div
      id="detailGrid"
      class="detail-grid"
    ></div>


    <button
      id="backButton"
      class="back-button"
      type="button"
    >
      Back
    </button>

  </section>

</main>


<script>


/* =========================================================
   GITHUB
========================================================= */

const OWNER = "songnansae";
const REPO = "SONGNANSAE";
const BRANCH = "main";

const ROOT = "images";


/* =========================================================
   CATEGORY
========================================================= */

const categories = [
  "commercial",
  "magazine",
  "personal",
  "film"
];


/* =========================================================
   ELEMENT
========================================================= */

const menuButton =
  document.getElementById("menuButton");

const menuPanel =
  document.getElementById("menuPanel");

const infoButton =
  document.getElementById("infoButton");

const infoPanel =
  document.getElementById("infoPanel");

const logo =
  document.getElementById("logo");

const projectList =
  document.getElementById("projectList");

const home =
  document.getElementById("home");

const homeImage =
  document.getElementById("homeImage");

const homeImageWrap =
  document.getElementById("homeImageWrap");

const detail =
  document.getElementById("detail");

const detailCategory =
  document.getElementById("detailCategory");

const detailTitle =
  document.getElementById("detailTitle");

const detailGrid =
  document.getElementById("detailGrid");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   STATE
========================================================= */

let currentCategory = "commercial";

let projectsByCategory = {
  commercial: [],
  magazine: [],
  personal: [],
  film: []
};

let homeImages = [];

let currentHomeIndex = 0;


/* =========================================================
   FORCE INITIAL STATE
========================================================= */

menuPanel.classList.remove("show");
infoPanel.classList.remove("show");

menuButton.textContent = "+";

home.style.display = "flex";
detail.classList.remove("show");


/* =========================================================
   NATURAL SORT
========================================================= */

function naturalSort(a, b) {

  return a.localeCompare(
    b,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );

}


/* =========================================================
   GITHUB PATH
========================================================= */

function encodePath(path) {

  return path
    .split("/")
    .map(part =>
      encodeURIComponent(part)
    )
    .join("/");

}


/* =========================================================
   GITHUB API
========================================================= */

async function github(path) {

  const url =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/contents/" +
    encodePath(path) +
    "?ref=" +
    BRANCH;

  const response =
    await fetch(url, {
      cache: "no-store"
    });

  if (!response.ok) {

    throw new Error(
      "GitHub API error: " +
      response.status
    );

  }

  return await response.json();

}


/* =========================================================
   IMAGE CHECK
========================================================= */

function isImage(file) {

  if (!file || !file.name) {
    return false;
  }

  return /\.(jpg|jpeg|png|webp|gif|avif)$/i
    .test(file.name);

}


/* =========================================================
   HOME
========================================================= */

async function loadHome() {

  try {

    const files =
      await github("images/home");


    homeImages =
      files
        .filter(file =>
          file.type === "file"
        )
        .filter(isImage)
        .sort((a, b) =>
          naturalSort(
            a.name,
            b.name
          )
        );


    if (!homeImages.length) {

      console.error(
        "images/home 폴더에 사진이 없습니다."
      );

      homeImage.style.display = "none";

      return;
    }


    currentHomeIndex = 0;

    showHomeImage();

  }

  catch (error) {

    console.error(
      "HOME LOAD ERROR:",
      error
    );

    homeImage.style.display = "none";

  }

}


/* =========================================================
   SHOW HOME
========================================================= */

function showHomeImage() {

  if (!homeImages.length) {
    return;
  }

  const image =
    homeImages[currentHomeIndex];

  homeImage.src =
    image.download_url;

  homeImage.alt =
    image.name;

}


/* =========================================================
   NEXT HOME
========================================================= */

function nextHomeImage() {

  if (homeImages.length <= 1) {
    return;
  }

  currentHomeIndex =
    (
      currentHomeIndex + 1
    ) %
    homeImages.length;

  showHomeImage();

}


/* =========================================================
   HOME CLICK
========================================================= */

homeImageWrap.addEventListener(
  "click",
  nextHomeImage
);


/* =========================================================
   LOAD CATEGORY
========================================================= */

async function loadCategory(category) {

  try {

    const folders =
      await github(
        "images/" + category
      );


    const projectFolders =
      folders
        .filter(item =>
          item.type === "dir"
        )
        .sort((a, b) =>
          naturalSort(
            a.name,
            b.name
          )
        );


    const projects = [];


    for (const folder of projectFolders) {

      try {

        const files =
          await github(folder.path);


        const images =
          files
            .filter(file =>
              file.type === "file"
            )
            .filter(isImage)
            .sort((a, b) =>
              naturalSort(
                a.name,
                b.name
              )
            );


        if (images.length) {

          projects.push({
            name: folder.name,
            path: folder.path,
            images: images
          });

        }

      }

      catch (error) {

        console.error(
          "PROJECT LOAD ERROR:",
          folder.name,
          error
        );

      }

    }


    projectsByCategory[category] =
      projects;


    renderProjectList(category);

  }

  catch (error) {

    console.error(
      "CATEGORY LOAD ERROR:",
      category,
      error
    );

    projectList.innerHTML = "";

  }

}


/* =========================================================
   PROJECT LIST
========================================================= */

function renderProjectList(category) {

  projectList.innerHTML = "";

  const projects =
    projectsByCategory[category] || [];


  projects.forEach(
    (project, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.type = "button";

      button.className =
        "project-item";

      button.textContent =
        project.name;


      button.addEventListener(
        "click",
        function() {

          openProject(
            category,
            index
          );

        }
      );


      projectList.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(
  category,
  index
) {

  const projects =
    projectsByCategory[category] || [];

  const project =
    projects[index];


  if (!project) {
    return;
  }


  /* HOME HIDE */

  home.style.display = "none";


  /* DETAIL SHOW */

  detail.classList.add("show");


  /* MENU CLOSE */

  menuPanel.classList.remove("show");

  menuButton.textContent = "+";


  /* TITLE */

  detailCategory.textContent =
    capitalize(category);

  detailTitle.textContent =
    project.name;


  /* CLEAR */

  detailGrid.innerHTML = "";


  /* IMAGES */

  project.images.forEach(
    image => {

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "detail-image";

      img.src =
        image.download_url;

      img.alt =
        image.name;

      img.loading =
        "lazy";


      detailGrid.appendChild(
        img
      );

    }
  );


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text) {

  return (
    text.charAt(0).toUpperCase() +
    text.slice(1)
  );

}


/* =========================================================
   MENU BUTTON
========================================================= */

menuButton.addEventListener(
  "click",
  async function() {

    const isOpen =
      menuPanel.classList.contains("show");


    if (isOpen) {

      menuPanel.classList.remove(
        "show"
      );

      menuButton.textContent =
        "+";

      return;
    }


    /* MENU OPEN */

    menuPanel.classList.add(
      "show"
    );

    infoPanel.classList.remove(
      "show"
    );

    menuButton.textContent =
      "−";


    /* LOAD COMMERCIAL */

    if (
      projectsByCategory[currentCategory].length === 0
    ) {

      await loadCategory(
        currentCategory
      );

    }

    else {

      renderProjectList(
        currentCategory
      );

    }

  }
);


/* =========================================================
   INFO BUTTON
========================================================= */

infoButton.addEventListener(
  "click",
  function() {

    infoPanel.classList.toggle(
      "show"
    );

    menuPanel.classList.remove(
      "show"
    );

    menuButton.textContent =
      "+";

  }
);


/* =========================================================
   CATEGORY TABS
========================================================= */

document
  .querySelectorAll(".menu-tab")
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        async function() {

          const category =
            tab.dataset.category;


          currentCategory =
            category;


          document
            .querySelectorAll(".menu-tab")
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          tab.classList.add(
            "active"
          );


          if (
            projectsByCategory[category].length === 0
          ) {

            await loadCategory(
              category
            );

          }

          else {

            renderProjectList(
              category
            );

          }

        }
      );

    }
  );


/* =========================================================
   LOGO → HOME
========================================================= */

logo.addEventListener(
  "click",
  function(event) {

    event.preventDefault();


    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    menuPanel.classList.remove(
      "show"
    );

    infoPanel.classList.remove(
      "show"
    );

    menuButton.textContent =
      "+";


    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
  "click",
  function() {

    detail.classList.remove(
      "show"
    );


    home.style.display =
      "flex";


    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   START
========================================================= */

loadHome();

</script>

</body>
</html>
