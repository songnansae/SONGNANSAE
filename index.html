<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Nansae — Photographer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}
button,a{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.header{height:92px;border-top:1px solid #111;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 12px;font-size:11px;position:sticky;top:0;background:#fff;z-index:20}
.header .left{text-align:left}.header .center{text-align:center}.header .right{text-align:right}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#111;vertical-align:middle}
.menu-toggle{font-size:22px;line-height:1}
.menu-panel{display:none;position:fixed;left:0;top:92px;background:#fff;z-index:19;padding:0 30px 28px;border-bottom:1px solid #111;width:100%}
.menu-panel.open{display:block}
.menu-controls{display:flex;gap:26px;font-size:40px;line-height:1;margin-bottom:28px}
.menu-links{display:flex;gap:42px;flex-wrap:wrap;font-size:25px}
.menu-links button{cursor:pointer}
.info-panel{display:none;position:fixed;right:0;top:92px;width:min(480px,100%);background:#fff;border-left:1px solid #111;border-bottom:1px solid #111;z-index:19;padding:30px;font-size:14px;line-height:1.6}
.info-panel.open{display:block}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.hero-card{min-width:0}
.hero-card img,.placeholder{display:block;width:100%;height:calc(100vh - 92px);min-height:520px;object-fit:cover}
.placeholder{background:#eee}
.caption{font-size:11px;padding:7px 5px 18px}
.view{display:none;padding:0 5px 60px}
.view.active{display:block}
.view-title{font-size:24px;margin:0 0 30px}
.work-list{display:flex;flex-direction:column;gap:10px;max-width:720px}
.work-list button{text-align:left;font-size:22px}
.work-list button:hover{text-decoration:underline}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.gallery img{width:100%;display:block;object-fit:contain;background:#f5f5f5}
.back{font-size:11px;margin-bottom:20px}
.empty{font-size:14px;color:#777;padding:30px 0}
@media(max-width:800px){
.header{height:62px}.menu-panel{top:62px;padding:0 20px 22px}.info-panel{top:62px}
.menu-links{font-size:20px;gap:22px}
.hero{grid-template-columns:1fr}
.hero-card img,.placeholder{height:calc(100vh - 62px);min-height:420px}
.hero-card:not(:first-child){display:none}
.caption{padding-bottom:14px}
.gallery{grid-template-columns:1fr}
.work-list button{font-size:19px}
}
</style>
</head>
<body>

<header class="header">
  <div class="left">
    <button class="menu-toggle" id="plus" aria-label="Open menu">＋</button>
    <button class="menu-toggle" id="minus" aria-label="Close menu">−</button>
  </div>
  <div class="center">Song Nansae</div>
  <div class="right">
    <button id="infoButton">Info</button>
    &nbsp;&nbsp;<span class="dot"></span>
  </div>
</header>

<nav class="menu-panel" id="menuPanel">
  <div class="menu-controls">
    <button id="plus2">＋</button>
    <button id="minus2">−</button>
  </div>
  <div class="menu-links">
    <button data-category="commercial">Commercial</button>
    <button data-category="magazine">Magazine</button>
    <button data-category="personal">Personal</button>
    <button data-category="film">Film</button>
  </div>
</nav>

<section class="info-panel" id="infoPanel">
  <div style="font-size:22px;margin-bottom:20px">Song Nansae</div>
  Photographer<br>
  Seoul, Korea<br><br>
  For commissions and inquiries<br>
  <a href="mailto:hello@songnansae.com">hello@songnansae.com</a><br>
  Instagram&nbsp; @songnansae
</section>

<main id="home">
  <section class="hero" id="hero"></section>
</main>

<section class="view" id="categoryView">
  <button class="back" id="backHome">← Back</button>
  <h1 class="view-title" id="categoryTitle"></h1>
  <div class="work-list" id="workList"></div>
</section>

<section class="view" id="workView">
  <button class="back" id="backCategory">← Back</button>
  <h1 class="view-title" id="workTitle"></h1>
  <div class="gallery" id="gallery"></div>
</section>

<script>
/*
  V1 구조:
  GitHub Repository의 아래 폴더를 자동으로 읽는다.
  images/commercial/작업명/01.jpg
  images/magazine/작업명/01.jpg
  images/personal/작업명/01.jpg
  images/film/작업명/01.jpg

  중요: GITHUB_OWNER만 네 실제 GitHub 사용자명으로 맞추면 된다.
*/
const GITHUB_OWNER = "songnansae";
const GITHUB_REPO = "SONGNANSAE";
const GITHUB_BRANCH = "main";
const IMAGE_ROOT = "images";

const categories = ["commercial","magazine","personal","film"];
let cache = {};

const hero = document.getElementById("hero");
const home = document.getElementById("home");
const categoryView = document.getElementById("categoryView");
const workView = document.getElementById("workView");
const menuPanel = document.getElementById("menuPanel");
const infoPanel = document.getElementById("infoPanel");

function rawUrl(path){
  return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
}
async function api(path){
  const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`);
  if(!r.ok) throw new Error("GitHub API error");
  return r.json();
}
async function listDirs(path){
  try{
    const items = await api(path);
    return items.filter(x=>x.type==="dir");
  }catch(e){ return []; }
}
async function listImages(path){
  try{
    const items = await api(path);
    return items.filter(x=>x.type==="file" && /\.(jpe?g|png|webp|gif)$/i.test(x.name))
      .sort((a,b)=>a.name.localeCompare(b.name,navigator.language,{numeric:true}));
  }catch(e){ return []; }
}

async function loadData(){
  for(const c of categories){
    const dirs = await listDirs(`${IMAGE_ROOT}/${c}`);
    cache[c] = [];
    for(const d of dirs){
      const imgs = await listImages(d.path);
      cache[c].push({name:d.name,path:d.path,images:imgs});
    }
  }
}

function showHome(){
  home.style.display="block"; categoryView.classList.remove("active"); workView.classList.remove("active");
}
function showCategory(c){
  home.style.display="none"; workView.classList.remove("active"); categoryView.classList.add("active");
  document.getElementById("categoryTitle").textContent=c[0].toUpperCase()+c.slice(1);
  const list=document.getElementById("workList"); list.innerHTML="";
  (cache[c]||[]).forEach(work=>{
    const b=document.createElement("button");
    b.textContent=work.name;
    b.onclick=()=>showWork(c,work.name);
    list.appendChild(b);
  });
  if(!list.children.length) list.innerHTML='<div class="empty">이 카테고리에 아직 작업이 없습니다.</div>';
}
function showWork(c,name){
  home.style.display="none"; categoryView.classList.remove("active"); workView.classList.add("active");
  const work=(cache[c]||[]).find(x=>x.name===name);
  document.getElementById("workTitle").textContent=name;
  const gallery=document.getElementById("gallery"); gallery.innerHTML="";
  if(!work || !work.images.length){gallery.innerHTML='<div class="empty">사진이 없습니다.</div>';return;}
  work.images.forEach(img=>{
    const el=document.createElement("img");
    el.src=rawUrl(img.path);
    el.alt=name;
    gallery.appendChild(el);
  });
}
function renderHero(){
  hero.innerHTML="";
  const all=[];
  for(const c of categories) for(const w of (cache[c]||[])) if(w.images[0]) all.push({c,w});
  all.slice(0,3).forEach(({c,w})=>{
    const card=document.createElement("article"); card.className="hero-card";
    const img=document.createElement("img"); img.src=rawUrl(w.images[0].path); img.alt=w.name;
    card.appendChild(img);
    const cap=document.createElement("div"); cap.className="caption"; cap.textContent=`${capitalize(c)}, ${w.name}`;
    card.appendChild(cap); card.onclick=()=>showWork(c,w.name); hero.appendChild(card);
  });
  if(!hero.children.length){
    for(let i=0;i<3;i++){const card=document.createElement("article");card.className="hero-card";card.innerHTML='<div class="placeholder"></div><div class="caption">작업을 추가하면 여기에 표시됩니다.</div>';hero.appendChild(card);}
  }
}
function capitalize(s){return s[0].toUpperCase()+s.slice(1)}

document.getElementById("plus").onclick=()=>menuPanel.classList.add("open");
document.getElementById("plus2").onclick=()=>menuPanel.classList.add("open");
document.getElementById("minus").onclick=()=>menuPanel.classList.remove("open");
document.getElementById("minus2").onclick=()=>menuPanel.classList.remove("open");
document.getElementById("infoButton").onclick=()=>infoPanel.classList.toggle("open");

document.querySelectorAll("[data-category]").forEach(b=>{
  b.onclick=async()=>{
    menuPanel.classList.remove("open");
    await loadData();
    showCategory(b.dataset.category);
  };
});
document.getElementById("backHome").onclick=showHome;
document.getElementById("backCategory").onclick=()=>showCategory(window.currentCategory);

(async()=>{
  try{
    await loadData();
    renderHero();
  }catch(e){renderHero();}
})();
</script>
</body>
</html>
