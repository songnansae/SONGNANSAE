<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONGNANSAE</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #111;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
}

body {
  overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 52px;

  z-index: 10000;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 0 14px;

  background: rgba(255,255,255,0.96);
}

.menu-button {
  justify-self: start;

  position: relative;
  z-index: 10001;

  border: 0;
  background: transparent;

  padding: 0;
  margin: 0;

  color: #111;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;

  pointer-events: auto;
}

.logo {
  justify-self: center;

  position: relative;
  z-index: 10001;

  color: #111;
  text-decoration: none;

  font-size: 13px;
  line-height: 1;

  cursor: pointer;
}

.info-button {
  justify-self: end;

  position: relative;
  z-index: 10001;

  border: 0;
  background: transparent;

  padding: 0;
  margin: 0;

  color: #111;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;

  pointer-events: auto;
}


/* =========================
   INFO
========================= */

.info-panel {
  display: none;

  position: fixed;

  top: 52px;
  right: 14px;

  z-index: 9999;

  width: 260px;

  padding: 0;

  background: #fff;

  color: #111;

  font-size: 13px;
  line-height: 1.4;
}

.info-panel.show {
  display: block !important;
}

.info-panel a {
  color: #111;
  text-decoration: none;
}

.info-panel a:hover {
  text-decoration: underline;
}


/* =========================
   MENU
========================= */

.menu-panel {
  display: none;

  position: fixed;

  top: 52px;
  left: 14px;

  z-index: 9999;

  width: 320px;

  padding: 0;

  background: #fff;

  color: #111;

  pointer-events: auto;
}

.menu-panel.show {
  display: block !important;
}

.menu-tabs {
  display: flex;

  gap: 18px;

  margin: 0 0 20px 0;
  padding: 0;
}

.menu-tab {
  border: 0;
  background: transparent;

  padding: 0;
  margin: 0;

  color: #111;

  font-family: inherit;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;

  pointer-events: auto;
}

.menu-tab.active {
  text-decoration: underline;
}

.project-list {
  display: flex;

  flex-direction: column;

  gap: 6px;

  margin: 0;
  padding: 0;
}

.project-item {
  display: block;

  width: max-content;

  border: 0;
  background: transparent;

  padding: 0;
  margin: 0;

  color: #111;

  text-align: left;

  font-family: inherit;
  font-size: 13px;
  line-height: 1.2;

  cursor: pointer;

  pointer-events: auto;
}

.project-item:hover {
  text-decoration: underline;
}


/* =========================
   MAIN
========================= */

main {
  padding-top: 52px;
}


/* =========================
   HOME
========================= */

.home {
  width: 100%;

  min-height: calc(100vh - 52px);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0;
}

.home-image-wrap {
  width: 100%;

  height: calc(100vh - 52px);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0;

  cursor: pointer;
}

.home-image {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  user-select: none;

  -webkit-user-drag: none;
}


/* =========================
   DETAIL
========================= */

.detail {
  display: none;

  width: 100%;

  padding: 78px 14px 50px;
}

.detail.show {
  display: block;
}

.detail-header {
  display: flex;

  justify-content: space-between;
  align-items: baseline;

  margin-bottom: 24px;
}

.detail-category {
  font-size: 13px;
}

.detail-title {
  font-size: 13px;
}


/* =========================
   PROJECT IMAGE LIST
========================= */

.detail-grid {
  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 30px;

  width: 100%;
}


/*
  핵심

  사진을 화면 안에 통째로 넣음.
  절대 크롭하지 않음.
*/

.detail-image {
  display: block;

  width: auto;
  height: auto;

  max-width: 100%;

  /*
    헤더 + 제목 + 여백을 제외한
    화면 높이 안에서 한 장이
    최대한 크게 보이도록 함
  */

  max-height: calc(100vh - 150px);

  object-fit: contain;
  object-position: center;

  margin: 0 auto;
  padding: 0;

  flex: 0 0 auto;
}


/* =========================
   BACK
========================= */

.back-button {
  display: block;

  margin-top: 40px;

  border: 0;
  background: transparent;

  padding: 0;

  color: #111;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.back-button:hover {
  text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: 48px;

    padding: 0 12px;
  }

  main {
    padding-top: 48px;
  }

  .menu-panel {
    top: 48px;
    left: 12px;

    width: calc(100% - 24px);
  }

  .info-panel {
    top: 48px;
    right: 12px;
  }

  .home {
    min-height: calc(100vh - 48px);
  }

  .home-image-wrap {
    height: calc(100vh - 48px);
  }

  .detail {
    padding: 68px 10px 40px;
  }

  .detail-grid {
    gap: 20px;
  }

  .detail-image {
    max-width: 100%;

    max-height: calc(100vh - 120px);
  }
}
</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <button
    id="menuButton"
    class="menu-button"
    type="button"
    aria-label="Menu"
  >+</button>


  <a
    href="#"
    id="logo"
    class="logo"
  >SONGNANSAE</a>


  <button
    id="infoButton"
    class="info-button"
    type="button"
    aria-label="Info"
  >Info</button>

</header>



<!-- =========================
     INFO PANEL
========================= -->

<div
  id="infoPanel"
  class="info-panel"
>

  <div>Commercial Photographer</div>
  <div>Seoul, Korea</div>

  <br>

  <div>For commissions and inquiries</div>

  <div>
    <a href="mailto:songnansae@gmail.com">
      songnansae@gmail.com
    </a>
  </div>

  <div>
    <a
      href="https://www.instagram.com/songnansae/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  </div>

</div>



<!-- =========================
     MENU PANEL
========================= -->

<div
  id="menuPanel"
  class="menu-panel"
>

  <div class="menu-tabs">

    <button
      class="menu-tab active"
      data-category="commercial"
      type="button"
    >
      Commercial
    </button>


    <button
      class="menu-tab"
      data-category="magazine"
      type="button"
    >
      Magazine
    </button>


    <button
      class="menu-tab"
      data-category="personal"
      type="button"
    >
      Personal
    </button>


    <button
      class="menu-tab"
      data-category="film"
      type="button"
    >
      Film
    </button>

  </div>


  <div
    id="projectList"
    class="project-list"
  ></div>

</div>



<!-- =========================
     MAIN
========================= -->

<main>


  <!-- =====================
       HOME
  ====================== -->

  <section
    id="home"
    class="home"
  >

    <div
      id="homeImageWrap"
      class="home-image-wrap"
    >

      <img
        id="homeImage"
        class="home-image"
        src=""
        alt=""
      >

    </div>

  </section>



  <!-- =====================
       DETAIL
  ====================== -->

  <section
    id="detail"
    class="detail"
  >

    <div class="detail-header">

      <div
        id="detailCategory"
        class="detail-category"
      ></div>


      <div
        id="detailTitle"
        class="detail-title"
      ></div>

    </div>


    <div
      id="detailGrid"
      class="detail-grid"
    ></div>


    <button
      id="backButton"
      class="back-button"
      type="button"
    >
      Back
    </button>

  </section>

</main>



<script>

/* =========================================================
   GITHUB
========================================================= */

const GITHUB_OWNER = "songnansae";

const GITHUB_REPO = "SONGNANSAE";

const GITHUB_BRANCH = "main";

const IMAGE_ROOT = "images";


/* =========================================================
   STATE
========================================================= */

let currentCategory = "commercial";

let projectsByCategory = {
  commercial: [],
  magazine: [],
  personal: [],
  film: []
};

let homeImages = [];

let currentHomeIndex = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const menuButton =
  document.getElementById("menuButton");

const logo =
  document.getElementById("logo");

const infoButton =
  document.getElementById("infoButton");

const menuPanel =
  document.getElementById("menuPanel");

const infoPanel =
  document.getElementById("infoPanel");

const projectList =
  document.getElementById("projectList");

const home =
  document.getElementById("home");

const homeImage =
  document.getElementById("homeImage");

const homeImageWrap =
  document.getElementById("homeImageWrap");

const detail =
  document.getElementById("detail");

const detailCategory =
  document.getElementById("detailCategory");

const detailTitle =
  document.getElementById("detailTitle");

const detailGrid =
  document.getElementById("detailGrid");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   NATURAL SORT
========================================================= */

function naturalSort(a, b) {

  return a.localeCompare(
    b,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );

}


/* =========================================================
   GITHUB PATH
========================================================= */

function encodePath(path) {

  return path
    .split("/")
    .map(
      part => encodeURIComponent(part)
    )
    .join("/");

}


/* =========================================================
   GITHUB API
========================================================= */

async function getGitHubContents(path) {

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `contents/${encodePath(path)}` +
    `?ref=${GITHUB_BRANCH}`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "GitHub API error: " +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   IMAGE CHECK
========================================================= */

function isImage(file) {

  if (!file || !file.name) {
    return false;
  }

  return /\.(jpg|jpeg|png|webp|gif|avif)$/i
    .test(file.name);

}


/* =========================================================
   LOAD HOME
========================================================= */

async function loadHome() {

  try {

    const contents =
      await getGitHubContents(
        `${IMAGE_ROOT}/home`
      );


    homeImages =
      contents
        .filter(
          item => item.type === "file"
        )
        .filter(isImage)
        .sort(
          (a, b) =>
            naturalSort(
              a.name,
              b.name
            )
        );


    if (homeImages.length === 0) {

      homeImage.style.display = "none";

      return;

    }


    currentHomeIndex = 0;

    showHomeImage();

  }

  catch (error) {

    console.error(
      "HOME ERROR:",
      error
    );

    homeImage.style.display = "none";

  }

}


/* =========================================================
   SHOW HOME
========================================================= */

function showHomeImage() {

  if (!homeImages.length) {
    return;
  }


  const image =
    homeImages[currentHomeIndex];


  homeImage.src =
    image.download_url;

  homeImage.alt =
    image.name;

}


/* =========================================================
   NEXT HOME
========================================================= */

function nextHomeImage() {

  if (homeImages.length <= 1) {
    return;
  }


  currentHomeIndex =
    (currentHomeIndex + 1)
    % homeImages.length;


  showHomeImage();

}


/* =========================================================
   HOME CLICK
========================================================= */

homeImageWrap.addEventListener(
  "click",
  nextHomeImage
);


/* =========================================================
   LOAD CATEGORY
========================================================= */

async function loadCategory(category) {

  try {

    const contents =
      await getGitHubContents(
        `${IMAGE_ROOT}/${category}`
      );


    const folders =
      contents
        .filter(
          item => item.type === "dir"
        )
        .sort(
          (a, b) =>
            naturalSort(
              a.name,
              b.name
            )
        );


    const projects = [];


    for (const folder of folders) {

      try {

        const files =
          await getGitHubContents(
            folder.path
          );


        const images =
          files
            .filter(
              item =>
                item.type === "file"
            )
            .filter(isImage)
            .sort(
              (a, b) =>
                naturalSort(
                  a.name,
                  b.name
                )
            );


        if (images.length > 0) {

          projects.push({

            name: folder.name,

            path: folder.path,

            images: images

          });

        }

      }

      catch (error) {

        console.error(
          "PROJECT ERROR:",
          folder.name,
          error
        );

      }

    }


    projectsByCategory[category] =
      projects;


    renderProjectList(category);

  }

  catch (error) {

    console.error(
      "CATEGORY ERROR:",
      category,
      error
    );

    projectList.innerHTML = "";

  }

}


/* =========================================================
   PROJECT LIST
========================================================= */

function renderProjectList(category) {

  projectList.innerHTML = "";


  const projects =
    projectsByCategory[category] || [];


  projects.forEach(
    (project, index) => {

      const button =
        document.createElement("button");


      button.type = "button";

      button.className =
        "project-item";

      button.textContent =
        project.name;


      button.addEventListener(
        "click",
        function() {

          openProject(
            category,
            index
          );

        }
      );


      projectList.appendChild(button);

    }
  );

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(category, index) {

  const projects =
    projectsByCategory[category] || [];


  const project =
    projects[index];


  if (!project) {
    return;
  }


  /*
    HOME 숨기기
  */

  home.style.display = "none";


  /*
    DETAIL 열기
  */

  detail.classList.add("show");


  /*
    MENU 닫기
  */

  menuPanel.classList.remove("show");

  menuButton.textContent = "+";


  /*
    제목
  */

  detailCategory.textContent =
    capitalize(category);

  detailTitle.textContent =
    project.name;


  /*
    기존 사진 삭제
  */

  detailGrid.innerHTML = "";


  /*
    사진 생성
  */

  project.images.forEach(
    image => {

      const img =
        document.createElement("img");


      img.className =
        "detail-image";


      img.src =
        image.download_url;


      img.alt =
        image.name;


      img.loading = "lazy";


      detailGrid.appendChild(img);

    }
  );


  /*
    위로 이동
  */

  window.scrollTo(0, 0);

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text) {

  return (
    text.charAt(0).toUpperCase() +
    text.slice(1)
  );

}


/* =========================================================
   MENU BUTTON
========================================================= */

menuButton.addEventListener(
  "click",
  async function(event) {

    event.preventDefault();

    event.stopPropagation();


    const isOpen =
      menuPanel.classList.contains("show");


    /*
      이미 열려 있으면 닫기
    */

    if (isOpen) {

      menuPanel.classList.remove("show");

      menuButton.textContent = "+";

      return;

    }


    /*
      메뉴 열기
    */

    menuPanel.classList.add("show");

    infoPanel.classList.remove("show");

    menuButton.textContent = "−";


    /*
      현재 카테고리 프로젝트 불러오기
    */

    if (
      projectsByCategory[currentCategory]
        .length === 0
    ) {

      await loadCategory(
        currentCategory
      );

    }

    else {

      renderProjectList(
        currentCategory
      );

    }

  }
);


/* =========================================================
   INFO BUTTON
========================================================= */

infoButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    event.stopPropagation();


    const isOpen =
      infoPanel.classList.contains("show");


    if (isOpen) {

      infoPanel.classList.remove("show");

    }

    else {

      infoPanel.classList.add("show");

      menuPanel.classList.remove("show");

      menuButton.textContent = "+";

    }

  }
);


/* =========================================================
   CATEGORY TABS
========================================================= */

document
  .querySelectorAll(".menu-tab")
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        async function(event) {

          event.preventDefault();

          event.stopPropagation();


          const category =
            tab.dataset.category;


          currentCategory =
            category;


          /*
            active 변경
          */

          document
            .querySelectorAll(".menu-tab")
            .forEach(
              item => {

                item.classList.remove("active");

              }
            );


          tab.classList.add("active");


          /*
            프로젝트 불러오기
          */

          if (
            projectsByCategory[category]
              .length === 0
          ) {

            await loadCategory(
              category
            );

          }

          else {

            renderProjectList(
              category
            );

          }

        }
      );

    }
  );


/* =========================================================
   LOGO → HOME
========================================================= */

logo.addEventListener(
  "click",
  function(event) {

    event.preventDefault();


    detail.classList.remove("show");


    home.style.display = "flex";


    menuPanel.classList.remove("show");

    infoPanel.classList.remove("show");


    menuButton.textContent = "+";


    window.scrollTo(0, 0);

  }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
  "click",
  function() {

    detail.classList.remove("show");


    home.style.display = "flex";


    window.scrollTo(0, 0);

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadHome();

</script>

</body>
</html>
